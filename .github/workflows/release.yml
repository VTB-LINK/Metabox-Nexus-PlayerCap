name: Release on Tag

on:
  push:
    tags:
      # 现有 glob 已覆盖 prerelease tag，例如 v3.0.0-beta.32、v3.0.0-rc.1.a
      - 'v*.*.*'
  # 演练：手动派发一律只演练、不发布（判据见 jobs.release.env.PUBLISH）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 五道门禁（gates.yml）。不通过则发版作业不启动，任何 draft 都不建。
  gates:
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read

  release:
    needs: gates
    runs-on: [windows, X64]
    timeout-minutes: 45
    # 发布用 build-production，演练用 build-dev。environment 取不到 env 上下文，判据只能在这里
    # 再写一遍，须与下面的 PUBLISH 一致（releaseworkflow_test.go 核对两处）。
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'build-production' || 'build-dev' }}
    defaults:
      run:
        shell: pwsh
    env:
      # 发布与否的唯一判据：只有 tag 推送才发布（建两边 draft 与 Gitee 发行版、取发版说明、建 Sentry release）。
      # 手动派发即使选了 tag 作为 ref 也只演练。各发布步骤以 `if: env.PUBLISH == 'true'` 限定，
      # 发布用的三个凭据也只在它为真时引用；releaseworkflow_test.go 核对这些写法。
      # 设计见 doc/design/ci-windows-release-design.md §3.2。
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      GOOS: windows
      GOARCH: amd64
      # 固定为交叉编译时的隐含值：原生 Windows 上找得到 gcc 时 CGO_ENABLED 默认为 1。
      # 迁移到 Windows runner 之前，发版在 Linux 上交叉编译，exe 一直不含 cgo。
      CGO_ENABLED: '0'
      OUTPUT_NAME: Metabox-Nexus-PlayerCap
      DOTCOM_ARCHIVE_NAME: Metabox-Nexus-PlayerCap.zip
      DOTCOM_OWNER: VTB-LINK
      DOTCOM_REPO_NAME: Metabox-Nexus-PlayerCap
      DOTCOM_GITHUB_BASE: https://github.com
      GITEE_OWNER: VTB-LINK
      GITEE_REPO_NAME: Metabox-Nexus-PlayerCap
      # Gitee 镜像保留的发行版个数，见 Prune old releases (Gitee mirror)。
      GITEE_KEEP_RELEASES: 7
      HTML_FILE_NAME: lyric_display.html

      # gh 与 sentry-cli 钉死版本，每次下载后按 SHA-256 校验，不依赖 runner 镜像预装。SHA-256 的出处：
      #   gh：https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_checksums.txt
      #       中 gh_2.103.3_windows_amd64.zip 一行
      #   sentry-cli：Sentry 发布注册表 https://release-registry.services.sentry.io/apps/sentry-cli/3.8.2
      #       （源文件 getsentry/sentry-release-registry 的 apps/sentry-cli/3.8.2.json）中
      #       sentry-cli-Windows-x86_64.exe 的 sha256-hex，与 GitHub release 该资产的 digest 相同
      # 升级时版本与 SHA-256 一起改，按同一出处重取。
      GH_CLI_VERSION: 2.103.3
      GH_CLI_SHA256: 98d0cfa794721665d7973dd728c78aff7bd836d58f10f6d7a03568eccb0a22e0
      SENTRY_CLI_VERSION: 3.8.2
      SENTRY_CLI_SHA256: 50009f23c49d6e9ff7624204c7035855303b49c5e326708ee783c1fdf783ac83

      # Sentry（遥测上报，issue #33）。org/project 是字面量，放这里方便改；
      # token 与 DSN 都走 secret，不进仓库。
      # 不需要 SENTRY_URL —— 那是自托管实例才要的，本项目用 sentry.io 官方。
      SENTRY_ORG: kzmtech
      SENTRY_PROJECT: vtb-tools-metabox-nexus-playercap

    # pwsh 的退出码：Actions 只检查脚本最后一条原生命令的 $LASTEXITCODE，中间的失败会被吞掉，
    # 故每条原生命令之后都显式检查。
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 默认是 fetch-depth: 1（浅克隆，只有一个 commit）。set-commits --auto 要在本地
          # git 历史里找出「上个 release 到这次之间的 commits」，浅克隆下它什么也找不到 ——
          # **这是 set-commits 唯一真正的阻塞项**（实测：加上它 set-commits 当场就通了）。
          # 代价实测：353 个 commit / .git 57M，多花几秒。
          #
          # 顺带治好一个显示问题（实测已证实）：浅克隆让 Go 看不到任何 tag 祖先，于是
          # debug.ReadBuildInfo() 里的主模块版本退化成 v0.0.0-<时间>-<hash>，而 Sentry 的
          # 「软件包」列表读的正是它。三组对照：
          #
          #   本地（完整历史）      v1.1.1-0.20260716204836-adf0a532583b
          #   CI（depth=1）        v0.0.0-20260716202135-22e3d0c9c0e1     ← 找不到 base
          #   CI（depth=0）        v1.1.1-0.20260716205530-b00ba6b4e159   ← 修好了
          #
          # 注意 base 是 v1.1.0 而不是 HEAD 上的 v3.0.0-beta.24 —— **Go 挑 base version 时
          # 跳过 prerelease tag**，会一路回溯到最近的正式版。
          #
          # 这一项**不影响 release 归属**：release 名走的是 ldflags 注入的 main.Version，
          # 与 build info 是两套独立的东西。
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Set up GitHub CLI
        run: |
          # 发版说明一步靠 pwsh 7.4 起「原生命令的标准输出重定向到文件时保留字节」取 gh 的输出，
          # 低于 7.4 即在这里失败。本步两种模式都跑，演练中就能看到。
          Write-Output "pwsh: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion -lt [version]'7.4') {
            Write-Output '::error::pwsh 7.4 or later is required to keep native command output bytes intact.'
            exit 1
          }

          # 不依赖镜像预装：每次下载钉死版本的官方 zip，按官方 checksums 校验（出处见作业级 env）。
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP "gh_${env:GH_CLI_VERSION}_windows_amd64.zip"
          Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v${env:GH_CLI_VERSION}/gh_${env:GH_CLI_VERSION}_windows_amd64.zip" -OutFile $zip -TimeoutSec 120
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne $env:GH_CLI_SHA256) {
            Write-Output "::error::gh zip SHA-256 mismatch: got ${hash}, want ${env:GH_CLI_SHA256}"
            exit 1
          }
          $dir = Join-Path $env:RUNNER_TEMP 'gh'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force

          # GITHUB_PATH 只对后续步骤生效：本步以绝对路径执行刚校验的这一份，核对为钉死版本。
          $exe = Join-Path $dir 'bin\gh.exe'
          $version = @(& $exe --version)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version | ForEach-Object { Write-Output $_ }
          if ($version[0] -notmatch "^gh version $([regex]::Escape($env:GH_CLI_VERSION)) ") {
            Write-Output "::error::${exe} is not gh ${env:GH_CLI_VERSION}"
            exit 1
          }
          # 前置于 PATH：后续步骤里镜像自带的 gh（如有）不会被用到。
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dir 'bin') -Encoding utf8

      - name: Extract version
        run: |
          # 后续步骤取到的 gh 应为上一步装的那一份（GITHUB_PATH 自本步起生效）。
          Write-Output "gh: $((Get-Command gh).Source)"

          if ($env:PUBLISH -eq 'true') {
            # 发布：tag 去掉一个前导 v 即版本号，如 v4.0.0-rc.5 为 4.0.0-rc.5（同迁移前 bash 的 ${TAG_NAME#v}）。
            $TAG_NAME = $env:GITHUB_REF_NAME
            $VERSION = $TAG_NAME -creplace '^v', ''
          } else {
            # 演练：取开发构建同形的非 semver 版本号（同 build-windows.yml），产物因此跳过自动更新
            # 检查（main.isReleaseVersion，§12 的 kill switch）。演练不发布，没有 tag。
            $COMMIT_HASH = git rev-parse --short HEAD
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $BUILD_TIME = (Get-Date).ToString('yyyyMMdd-HHmmss', [cultureinfo]::InvariantCulture)
            $TAG_NAME = ''
            $VERSION = "${env:OUTPUT_NAME}-${BUILD_TIME}-${COMMIT_HASH}"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=${TAG_NAME}" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=${VERSION}" -Encoding utf8
          Write-Output "Release version: ${VERSION} (tag: ${TAG_NAME}, publish: ${env:PUBLISH})"

      - name: Generate Windows icon resource (multi-size + version)
        run: |
          # 从高分母版生成多尺寸图标 .syso（16..256 共 10 档，每档 Lanczos3 降采样 + unsharp 锐化）
          # 并写入版本信息（发布时为 tag 版本）。取代旧的「拷贝单尺寸静态 .syso」——单尺寸会让 Windows 在
          # 小尺寸场景现缩大图产生锯齿。runner 是 Windows，生成器原生运行，产物即 windows/amd64 资源，
          # 随后被 go build 自动链接。
          go run ./tools/winicon `
            -master build-assets/winicon/masters/metabox5-sqr.png `
            -version $env:VERSION `
            -o resource_windows_amd64.syso
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build Windows executable
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # 输出文件名保持固定名（由 job env.OUTPUT_NAME 控制）
          $EXE_NAME = "${env:OUTPUT_NAME}.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "EXE_NAME=${EXE_NAME}" -Encoding utf8

          # Sentry DSN 从 secret 注入。secret 没配 → 空串 → 客户端自动禁用遥测，构建照常成功
          # （telemetry.Enabled 只看这个变量）。启动日志第一行会说「未注入 DSN，遥测已禁用」，
          # 那就是 secret 没生效的信号。
          #
          # 发布时 VERSION 是剥掉 v 前缀的 semver，会把遥测送进 production 环境，且直接用作
          # Sentry 的 release 名 —— 下面建 Sentry release 用的就是同一个 VERSION。
          # 演练时 VERSION 不是 semver，遥测进 development 环境，与开发构建相同。
          go build -ldflags "-X 'main.Version=${env:VERSION}' -X 'Metabox-Nexus-PlayerCap/telemetry.dsn=${env:SENTRY_DSN}'" -o "${EXE_NAME}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          if (Test-Path -LiteralPath $EXE_NAME) {
            Write-Output "${EXE_NAME}: $((Get-Item -LiteralPath $EXE_NAME).Length) bytes"
            Write-Output "Build successful: ${EXE_NAME}"
          } else {
            Write-Output 'Build failed!'
            exit 1
          }

      - name: Show build info
        run: |
          # 演练与首发的证据：main.Version、CGO_ENABLED、GOOS、GOARCH、vcs.revision。
          # -ldflags 一行含注入的 DSN，打印前把它的值换掉，不依赖日志对 secret 的脱敏；
          # 未注入时保持空值原样，看得出来。
          $info = go version -m $env:EXE_NAME
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $info -replace "telemetry\.dsn=[^'\s]+", 'telemetry.dsn=<redacted>' | ForEach-Object { Write-Output $_ }

      - name: Prepare files for packaging
        run: |
          $PACKAGE_DIR = "${env:OUTPUT_NAME}-V${env:VERSION}"
          New-Item -ItemType Directory -Force -Path $PACKAGE_DIR | Out-Null

          Copy-Item -LiteralPath $env:EXE_NAME -Destination $PACKAGE_DIR
          # 用内置默认生成 clean config.yml（不受开发者本地 config.yml 影响）。
          # -version 定随包 config.yml 的版本键 config-version（发版得到 "v<VERSION>"，演练得到开发构建的盖章值）
          go run ./tools/genconfig -version $env:VERSION "${PACKAGE_DIR}/config.yml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $env:HTML_FILE_NAME, 'lyric_page.html', 'effect_display.html', 'effect_page.html', 'doc/API_RESPONSE_EXAMPLES.md' -Destination $PACKAGE_DIR
          Copy-Item -LiteralPath 'README.md' -Destination $PACKAGE_DIR -ErrorAction SilentlyContinue

          # 随包使用说明（#215）：中英合一的 doc/release/README.html。先复制到工作目录，与 exe、html 一样供
          # dotcom 压缩包与三处发行版附件按文件名取用。
          Copy-Item -LiteralPath 'doc/release/README.html' -Destination 'README.html'
          Copy-Item -LiteralPath 'README.html' -Destination $PACKAGE_DIR
          # 使用说明.html 是它的逐字节副本：给看不懂英文的主播一个中文文件名，页面按文件名含「使用说明」默认显示中文。
          # 只进压缩包、不作发行版附件：附件不能用中文名（实测 GitHub 把 使用说明.txt 改成 default.txt，Gitee 成乱码）。
          Copy-Item -LiteralPath 'README.html' -Destination "${PACKAGE_DIR}/使用说明.html"

          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_DIR=${PACKAGE_DIR}" -Encoding utf8

      - name: Create compressed archive
        run: |
          $ARCHIVE_NAME = "${env:OUTPUT_NAME}-V${env:VERSION}.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE_NAME=${ARCHIVE_NAME}" -Encoding utf8

          # 本仓库发布用压缩包：压缩目录下的各文件而非目录本身，zip 内不含目录层级。
          Compress-Archive -Path "${env:PACKAGE_DIR}/*" -DestinationPath $ARCHIVE_NAME
          # github.com 发布用压缩包：exe、html 与两份使用说明（4.0 起不含 effect_page.html，见 issue #63；
          # 使用说明见 Prepare files for packaging，#215）。以文件为输入，条目都在根下。
          Compress-Archive -LiteralPath $env:EXE_NAME, $env:HTML_FILE_NAME, 'lyric_page.html', 'effect_display.html', 'README.html', "${env:PACKAGE_DIR}/使用说明.html" -DestinationPath $env:DOTCOM_ARCHIVE_NAME -Force

          # 列出两个包的条目，作为演练与首发的证据；两份使用说明缺一即失败。按名字在进程内比对，
          # 不依赖日志能否正确显示中文文件名。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($name in $ARCHIVE_NAME, $env:DOTCOM_ARCHIVE_NAME) {
            $path = (Resolve-Path -LiteralPath $name).Path
            $archive = [IO.Compression.ZipFile]::OpenRead($path)
            try {
              Write-Output "${name}: $((Get-Item -LiteralPath $path).Length) bytes, $($archive.Entries.Count) entries"
              $archive.Entries | ForEach-Object { Write-Output "  $($_.FullName) $($_.Length)" }
              $entries = @($archive.Entries.FullName)
            } finally {
              $archive.Dispose()
            }
            foreach ($doc in 'README.html', '使用说明.html') {
              if ($entries -cnotcontains $doc) {
                Write-Output "::error::${name} does not contain ${doc}"
                exit 1
              }
            }
          }

      - name: Create Release Draft (本仓库)
        # release 标题默认与 tag_name 一致；需要强制回退时，在 GitHub Release 页面手动追加 -force
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          draft: true
          generate_release_notes: true
          # 使用说明只附 README.html：附件不能用中文名，使用说明.html 只在压缩包里（#215）。
          files: |
            ${{ env.OUTPUT_NAME }}-V${{ env.VERSION }}.zip
            ${{ env.OUTPUT_NAME }}.exe
            README.html
            # ${{ env.OUTPUT_NAME }}-V${{ env.VERSION }}.exe

      - name: Generate release notes (dotcom mirror)
        if: env.PUBLISH == 'true'
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ env.PUBLISH == 'true' && secrets.GH_DOTCOM_TOKEN || '' }}
        run: |
          # 镜像仓库的自动 release notes，原样写入文件：pwsh 7.4 起，原生命令的标准输出重定向到
          # 文件时保留字节，不经字符串解码（Set up GitHub CLI 一步已要求 pwsh 7.4 以上）。
          gh api "repos/${env:DOTCOM_OWNER}/${env:DOTCOM_REPO_NAME}/releases/generate-notes" `
            --method POST `
            -f "tag_name=${env:TAG_NAME}" `
            --jq '.body' > auto-release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Compose release notes (dotcom and Gitee mirrors)
        run: |
          # 拼两个镜像仓库的发版说明，dotcom 一份逐字节复现迁移前 bash 的拼接（cp RELEASE_BODY.md、
          # heredoc 追加、echo 分隔、cat 追加）：
          #   RELEASE_BODY.md 原字节 + 固定模板（下载表格 + 项目信息）+ 分隔与标题 + 上一步写下的文件
          # Gitee 一份同一套模板，只到项目信息为止：上一步写下的是 GitHub 自动生成的说明，链接都指向 github.com。
          # 前后两段按字节拼入、不经解码；中间一段换行一律为 LF，按 UTF-8（无 BOM）编码。
          # 演练时没有 tag、没有上一步的文件，两处换成固定的占位。
          $utf8 = [Text.UTF8Encoding]::new($false)
          if ($env:PUBLISH -eq 'true') {
            $tag = $env:TAG_NAME
            $auto = [IO.File]::ReadAllBytes((Join-Path $PWD 'auto-release-notes.md'))
          } else {
            $tag = 'DRYRUN'
            $auto = $utf8.GetBytes("（演练：此处为 Generate release notes (dotcom mirror) 一步的输出）`n")
          }
          $body = [IO.File]::ReadAllBytes((Join-Path $PWD 'RELEASE_BODY.md'))

          # 下载链接各用自家的。「最新版」的写法两边不同：GitHub 为 releases/latest/download/<文件>，
          # Gitee 为 releases/download/latest/<文件>（GitHub 的写法在 Gitee 上 404）。Gitee 没有草稿，
          # dotcom 发布之前 Gitee 的 latest 已指向新版；只影响说明里的链接，客户端经网关更新，不受影响。
          $github = "${env:DOTCOM_GITHUB_BASE}/${env:DOTCOM_OWNER}/${env:DOTCOM_REPO_NAME}"
          $gitee = "https://gitee.com/${env:GITEE_OWNER}/${env:GITEE_REPO_NAME}"
          $targets = @(
            @{ Path = 'combined-release-notes.md'; Latest = "${github}/releases/latest/download"; Download = "${github}/releases/download"; Auto = $true }
            @{ Path = 'gitee-release-notes.md'; Latest = "${gitee}/releases/download/latest"; Download = "${gitee}/releases/download"; Auto = $false }
          )
          foreach ($target in $targets) {
            $lines = @(
              ''
              '---'
              ''
              '### 一键下载'
              ''
              '| 文件 | 最新版 | 当前版本 |'
              '| --- | --- | --- |'
            )
            # 与两个镜像的发行版附件一一对应。
            foreach ($file in $env:DOTCOM_ARCHIVE_NAME, $env:EXE_NAME, $env:HTML_FILE_NAME, 'lyric_page.html', 'effect_display.html', 'README.html') {
              $lines +="| ${file} | [下载]($($target.Latest)/${file}) | [下载]($($target.Download)/${tag}/${file}) |"
            }
            # 问题反馈在 GitHub，两份都指向它。
            $lines += @(
              ''
              '### 关于'
              '- 感谢您使用VTB-TOOLS Metabox Nexus PlayerCap！这是一个多播放器歌词实时推送工具，旨在提升您的K歌与直播体验。'
              "- 问题反馈请前往Discussions：${github}/discussions"
              '- API文档请前往：http://playercap.nexus.metabox.apifox.vtb.link/'
            )
            $tail = [byte[]]@()
            if ($target.Auto) {
              $lines += @(
                ''
                '---'
                ''
                '### 自动生成变更'
                ''
              )
              $tail = $auto
            }

            $notes = [IO.MemoryStream]::new()
            foreach ($part in $body, $utf8.GetBytes(($lines -join "`n") + "`n"), $tail) {
              $notes.Write($part, 0, $part.Length)
            }
            $path = Join-Path $PWD $target.Path
            [IO.File]::WriteAllBytes($path, $notes.ToArray())
            Write-Output "===== $($target.Path) ====="
            Write-Output ([IO.File]::ReadAllText($path))
          }

      # Gitee 镜像的发行版，国内下载前缀指向这里。客户端按网关给出的 dotcom digest 校验下载的文件，
      # 故附件须与 dotcom 的同名文件字节相同，即取同一次构建。tag 通常已由 sync-source-to-dotcom.yml
      # 推上；本步先到时 Gitee 从 main 建出 tag，随后源码同步把它强制改指到快照提交。
      # Gitee 没有草稿，建了即公开，故放在 dotcom draft 之前：本步失败时 dotcom draft 尚未建出，
      # 整个作业重跑即可让两边取同一次构建。
      - name: Create Release (Gitee mirror)
        if: env.PUBLISH == 'true'
        env:
          GITEE_TOKEN: ${{ env.PUBLISH == 'true' && secrets.GITEE_TOKEN || '' }}
        run: |
          # 只依赖环境变量与工作目录里的文件，可在本地补发。Actions 的 pwsh 已默认遇错即停，这里显式设置供本地使用。
          $ErrorActionPreference = 'Stop'
          if (-not $env:GITEE_TOKEN) {
            Write-Output '::error::GITEE_TOKEN is not set.'
            exit 1
          }
          $api = "https://gitee.com/api/v5/repos/${env:GITEE_OWNER}/${env:GITEE_REPO_NAME}/releases"

          # 令牌经请求头传，不进 URL。Gitee 不读 multipart 里的文本字段（实测 access_token 报 40001、其余报
          # missing），故建发行版用 urlencoded 表单（-Body 传哈希表），只有上传附件用 multipart。
          $auth = @{ Authorization = "token ${env:GITEE_TOKEN}" }

          # 已有发行版即失败、不覆盖：dotcom 发布之后重跑会以另一次构建替换这里的文件，与 dotcom 的
          # digest 对不上，国内客户端更新校验失败。没有发行版时接口返回 200、正文为 null。
          $existing = Invoke-RestMethod -Uri "${api}/tags/${env:TAG_NAME}" -Headers $auth -TimeoutSec 60
          if ($null -ne $existing) {
            Write-Output "::error::Gitee already has a release for ${env:TAG_NAME}. If it was left by an earlier failed run, delete it on Gitee and rerun."
            exit 1
          }

          $createMarker = "[//]: # (gitee-release-run:$([guid]::NewGuid().ToString('N')))"
          $rawBody = Get-Content -Raw -Encoding utf8 -LiteralPath 'gitee-release-notes.md'
          $releaseBody = if ($null -ne $rawBody) { $rawBody.TrimEnd("`r", "`n") + "`n`n${createMarker}`n" } else { "${createMarker}`n" }
          $release = $null
          $createAttempted = $false
          $createRejected = $false

          # 标题同 dotcom 取 tag_name；-force 只在 dotcom 上手改（网关读 dotcom）。
          # 创建发行版与单附件上传均纳入回滚保护；上传设整体时间预算，避免反复超时耗尽作业超时而无机会回滚（#256）。
          try {
            try {
              $createAttempted = $true
              $release = Invoke-RestMethod -Method Post -Uri $api -Headers $auth -TimeoutSec 60 -Body @{
                tag_name         = $env:TAG_NAME
                name             = $env:TAG_NAME
                body             = $releaseBody
                target_commitish = 'main'
              }
            } catch {
              $statusCode = $null
              if ($null -ne $_.Exception -and $null -ne $_.Exception.Response -and $null -ne $_.Exception.Response.StatusCode) {
                $statusCode = [int]$_.Exception.Response.StatusCode
              } elseif ($null -ne $_.Exception -and $null -ne $_.Exception.StatusCode) {
                $statusCode = [int]$_.Exception.StatusCode
              }
              if ($null -ne $statusCode -and $statusCode -ge 400 -and $statusCode -lt 500) {
                $createRejected = $true
              }
              throw
            }
            if ($null -eq $release -or -not $release.id) {
              throw "Gitee release creation returned no release id for ${env:TAG_NAME}."
            }
            Write-Output "Gitee release ${env:TAG_NAME}: id $($release.id)"

            # 作业上限 45m：前置 ≤10m + 建版 2m + 预算 18m + 尾次 POST ≤5m + 最坏回滚 8m = 43m < 45m。
            $uploadDeadline = [datetimeoffset]::UtcNow.AddMinutes(18)

            # 与 dotcom draft 的附件相同。
            foreach ($f in $env:DOTCOM_ARCHIVE_NAME, $env:EXE_NAME, $env:HTML_FILE_NAME, 'lyric_page.html', 'effect_display.html', 'README.html') {
              $asset = $null
              foreach ($attempt in 1..3) {
                if ([datetimeoffset]::UtcNow -ge $uploadDeadline) {
                  throw "Gitee attachment upload time budget exhausted before uploading ${f} (attempt ${attempt}/3)."
                }
                try {
                  if ($attempt -gt 1) {
                    $existingFiles = Invoke-RestMethod -Uri "${api}/$($release.id)/attach_files?per_page=100" -Headers $auth -TimeoutSec 60
                    if ($null -ne $existingFiles) {
                      foreach ($dup in @($existingFiles)) {
                        if ($null -ne $dup -and $dup.id -and $dup.name -ceq $f) {
                          Invoke-RestMethod -Method Delete -Uri "${api}/$($release.id)/attach_files/$($dup.id)" -Headers $auth -TimeoutSec 60 | Out-Null
                          Write-Output "Deleted stale attachment ${f} (id $($dup.id)) before retry."
                        }
                      }
                    }
                    Start-Sleep -Seconds 3
                    if ([datetimeoffset]::UtcNow -ge $uploadDeadline) {
                      throw "Gitee attachment upload time budget exhausted before uploading ${f} (attempt ${attempt}/3)."
                    }
                  }
                  $asset = Invoke-RestMethod -Method Post -Uri "${api}/$($release.id)/attach_files" -Headers $auth -TimeoutSec 300 -Form @{ file = Get-Item -LiteralPath $f }
                  break
                } catch {
                  if ($attempt -lt 3 -and [datetimeoffset]::UtcNow -lt $uploadDeadline) {
                    Write-Output "::warning::Uploading ${f} failed (attempt ${attempt}/3): $($_.Exception.Message). Retrying..."
                  } else {
                    throw
                  }
                }
              }
              if ($null -eq $asset -or $asset.name -cne $f) {
                throw "Gitee attachment name is '$($asset.name)', want '${f}'"
              }
              Write-Output "${f}: $($asset.browser_download_url)"
            }
          } catch {
            $releaseErr = $_
            $rollbackId = $null
            if ($null -ne $release -and $release.id) {
              $rollbackId = $release.id
            } elseif ($createAttempted -and -not $createRejected) {
              try {
                $orphan = Invoke-RestMethod -Uri "${api}/tags/${env:TAG_NAME}" -Headers $auth -TimeoutSec 60
                if ($null -ne $orphan) {
                  if ($orphan.id -and $orphan.tag_name -ceq $env:TAG_NAME -and $orphan.body -is [string] -and $orphan.body.Contains($createMarker, [System.StringComparison]::Ordinal)) {
                    $rollbackId = $orphan.id
                  } else {
                    Write-Output "::warning::Gitee release ${env:TAG_NAME} (id $($orphan.id)) does not match this run's ownership marker; skipping rollback."
                  }
                }
              } catch {
                Write-Output "::warning::Failed to check Gitee release ${env:TAG_NAME} during rollback: $($_.Exception.Message)"
              }
            }
            if ($rollbackId) {
              Write-Output "::warning::Rolling back incomplete Gitee release ${env:TAG_NAME} (id ${rollbackId})..."
              try {
                $uploaded = Invoke-RestMethod -Uri "${api}/${rollbackId}/attach_files?per_page=100" -Headers $auth -TimeoutSec 60
                if ($null -ne $uploaded) {
                  foreach ($a in @($uploaded)) {
                    if ($null -ne $a -and $a.id) {
                      try {
                        Invoke-RestMethod -Method Delete -Uri "${api}/${rollbackId}/attach_files/$($a.id)" -Headers $auth -TimeoutSec 60 | Out-Null
                      } catch {
                        Write-Output "::warning::Failed to delete Gitee attachment $($a.id) during rollback: $($_.Exception.Message)"
                      }
                    }
                  }
                }
              } catch {
                Write-Output "::warning::Failed to list Gitee attachments during rollback: $($_.Exception.Message)"
              }
              try {
                Invoke-RestMethod -Method Delete -Uri "${api}/${rollbackId}" -Headers $auth -TimeoutSec 60 | Out-Null
                Write-Output "Rolled back incomplete Gitee release ${env:TAG_NAME} (id ${rollbackId})."
              } catch {
                Write-Output "::warning::Failed to delete Gitee release ${rollbackId} during rollback: $($_.Exception.Message)"
              }
            }
            Write-Output "::error::Gitee release failed: $($releaseErr.Exception.Message)"
            exit 1
          }

      - name: Create Release Draft (dotcom mirror)
        if: env.PUBLISH == 'true'
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ env.PUBLISH == 'true' && secrets.GH_DOTCOM_TOKEN || '' }}
        run: |
          # 镜像仓库标题默认与 tag_name 一致；需要强制回退时，在 GitHub Release 页面手动追加 -force
          # 创建 Release Draft 并上传 zip + 独立文件（含特效页 effect_display.html 与使用说明 README.html）
          gh release create $env:TAG_NAME $env:DOTCOM_ARCHIVE_NAME $env:EXE_NAME $env:HTML_FILE_NAME lyric_page.html effect_display.html README.html `
            --repo "${env:DOTCOM_OWNER}/${env:DOTCOM_REPO_NAME}" `
            --title $env:TAG_NAME `
            --draft `
            --notes-file combined-release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Gitee 镜像只保留最近 GITEE_KEEP_RELEASES 个发行版：Gitee 附件合计上限 1GB，每个发行版约 25MB。
      # 客户端只下载网关指向的版本；历史版本在 dotcom 都在，回退所需的旧版本可从 dotcom 补传。
      # 不能只留 1 个：此时 dotcom 仍是草稿，网关指向的上一个版本须仍在 Gitee 上。同理，预发布不在这里删，
      # 正式版发布后删除全部预发布时，Gitee 上的一并手动删除（§12）。
      # 放在 dotcom draft 之后且 continue-on-error：此时两边发行版都已建出，清理失败若使作业失败，重跑会因
      # 同名发行版已存在而失败；额度离上限尚远，漏清一次无碍。
      - name: Prune old releases (Gitee mirror)
        if: env.PUBLISH == 'true'
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ env.PUBLISH == 'true' && secrets.GITEE_TOKEN || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GITEE_TOKEN) {
            Write-Output '::error::GITEE_TOKEN is not set.'
            exit 1
          }
          $api = "https://gitee.com/api/v5/repos/${env:GITEE_OWNER}/${env:GITEE_REPO_NAME}/releases"
          $auth = @{ Authorization = "token ${env:GITEE_TOKEN}" }
          $keep = [int]$env:GITEE_KEEP_RELEASES

          # Invoke-RestMethod 把返回的数组作为一个对象输出到管道，故先存入变量再展开。
          # 按 created_at 自行从新到旧排序，不依赖 direction 参数。
          $list = Invoke-RestMethod -Uri "${api}?per_page=100&direction=desc" -Headers $auth -TimeoutSec 60
          $releases = @($list | Sort-Object { [datetimeoffset]$_.created_at } -Descending)
          if ($releases.Count -le $keep) {
            Write-Output "Gitee has $($releases.Count) releases, keeping up to ${keep}; nothing to delete."
            exit 0
          }

          # 先逐个删附件、再删发行版：删除发行版时附件是否随之释放额度未核实。tag 与源码不动。
          foreach ($r in ($releases | Select-Object -Skip $keep)) {
            # 本次建的发行版无论排第几都不删。
            if ($r.tag_name -ceq $env:TAG_NAME) {
              Write-Output "Kept $($r.tag_name): created by this run."
              continue
            }
            $files = Invoke-RestMethod -Uri "${api}/$($r.id)/attach_files?per_page=100" -Headers $auth -TimeoutSec 60
            foreach ($f in $files) {
              Invoke-RestMethod -Method Delete -Uri "${api}/$($r.id)/attach_files/$($f.id)" -Headers $auth -TimeoutSec 60 | Out-Null
              Write-Output "Deleted $($r.tag_name)/$($f.name) ($($f.size) bytes)"
            }
            Invoke-RestMethod -Method Delete -Uri "${api}/$($r.id)" -Headers $auth -TimeoutSec 60 | Out-Null
            Write-Output "Deleted release $($r.tag_name) (id $($r.id))"
          }

      # 放在全部 release draft 之后：artifact 都发出去了，这个 Sentry release 才对应得上真实
      # 可下载的版本。
      #
      # continue-on-error 是刻意的：发版是主线，Sentry 是辅助。secret 没配、runner 连不上
      # sentry.io、token 过期 —— 任何一条都不许把已经打包好的发版拖成失败。
      #
      # ## 为什么用 sentry-cli 而不是 getsentry/action-release
      #
      # **action-release 在 GHES 上起不来**（实测 run #85，整个 job 挂在 "Set up job"）：
      # 它是 composite action，内部 `uses: actions/setup-node@53b83947...`（v3.7.0 钉的是
      # setup-node v6.3.0 的 SHA）。而 GHES 里 `actions/*` 是**本地镜像的专用 namespace**，
      # 强制走本地解析（错误 URL 就是 vlink.dev/api/v3/repos/actions/setup-node/...），
      # 本地镜像只同步 tag/branch、**没有任意 SHA** → 404。
      #
      # 两个反直觉的地方，记下来免得有人再踩：
      #   - 那个 setup-node 步骤带着 `if: runner.os == 'macOS' || runner.os == 'Windows'`，
      #     当时的 Linux runner 根本不会执行它 —— 但 **"Set up job" 的预下载不看 if**。
      #   - `getsentry/action-release` 本身下载成功了：非 `actions/*` 的仓库走 GitHub Connect
      #     去 github.com 拉，不受本地镜像限制。所以「能拉这个却拉不到那个」并不矛盾。
      #
      # action-release@v1 用的是 `actions/setup-node@v4`（tag），所以 vtb-rank 一直没撞上。
      # 但与其赌某个 tag 在 GHES 镜像里存在且够新，不如彻底不依赖 action —— sentry-cli 正是
      # Sentry 后台给出的原始做法，零 action 依赖。
      # ## 为什么拆成四步
      #
      # 这四步的**失败语义不同**，挤在一起会互相拖累：
      #   install / new / finalize+deploy —— 失败只意味着「Sentry 里没这个 release」，发版不受影响
      #   set-commits                     —— 依赖 Sentry 侧的 SCM 集成（那是 CI 之外的配置，
      #                                      随时可能变），绝不能拖累上面三步
      #
      # 曾经是一个 step + `set -euo pipefail`：那样 set-commits 一挂，finalize 与 deploy 就被
      # 跳过，release 停在半成品 —— 能认领 event，但没有 dateReleased、没有 deploy。
      # 那比干脆不做 set-commits **更糟**。
      - name: Install sentry-cli
        continue-on-error: true
        run: |
          # 下载钉死版本的官方可执行文件（Sentry 文档「Manual Download」：GitHub release 提供
          # Windows 可执行文件，单文件），按发布注册表的 SHA-256 校验（出处见作业级 env）。
          # 装到 runner 的临时目录，不碰系统目录。本步两种模式都跑，演练中就能验证下载与校验。
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TEMP 'sentry-cli'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'sentry-cli.exe'
          Invoke-WebRequest -Uri "https://github.com/getsentry/sentry-cli/releases/download/${env:SENTRY_CLI_VERSION}/sentry-cli-Windows-x86_64.exe" -OutFile $exe -TimeoutSec 120
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          if ($hash -ne $env:SENTRY_CLI_SHA256) {
            Write-Output "::error::sentry-cli SHA-256 mismatch: got ${hash}, want ${env:SENTRY_CLI_SHA256}"
            exit 1
          }

          # GITHUB_PATH 只对后续步骤生效：本步以绝对路径执行刚校验的这一份，核对为钉死版本。
          $version = @(& $exe --version)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version | ForEach-Object { Write-Output $_ }
          if ($version[0] -ne "sentry-cli ${env:SENTRY_CLI_VERSION}") {
            Write-Output "::error::${exe} is not sentry-cli ${env:SENTRY_CLI_VERSION}"
            exit 1
          }
          # 校验全部通过才把这一份的绝对路径交给后面三步（SENTRY_CLI）。后面三步只按这个路径调用：本步
          # continue-on-error，失败时 SENTRY_CLI 为空，它们报错退出，不会按名字取到 PATH 里未经校验的
          # 另一份并交出凭据（代码审第 1 轮）。
          Add-Content -Path $env:GITHUB_ENV -Value "SENTRY_CLI=${exe}" -Encoding utf8

      - name: Create Sentry release
        if: env.PUBLISH == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ env.PUBLISH == 'true' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          # release 名必须与客户端 ldflags 注入的 main.Version **逐字一致**，否则上报的 event
          # 认领不到这个 release。两边用的是同一个 VERSION（tag 剥掉 v 前缀，Extract version 一步写入），
          # 见上面的 "Build Windows executable"。
          if (-not $env:SENTRY_CLI) {
            Write-Output '::error::sentry-cli was not installed and verified (see Install sentry-cli).'
            exit 1
          }
          & $env:SENTRY_CLI releases new $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # **实测可用**（v3.0.0-beta.24，run #22271）：
      #
      #   +---------------------------------+--------------+
      #   | Repository                      | Revision     |
      #   +---------------------------------+--------------+
      #   | KZMTECH/Metabox-Nexus-PlayerCap | b00ba6b4e159 |
      #   +---------------------------------+--------------+
      #
      # 这推翻了先前写在多处 commit message 里的判断「Sentry 尚未配置本组织的 GHES 集成」。
      # 那个判断的依据是 `/api/0/organizations/kzmtech/repos/` 返回空数组 —— 但那多半只是
      # free plan 的 token 读不到该接口，不代表没有 repo。**唯一真正挡路的是浅克隆**，
      # 上面的 checkout 加了 fetch-depth: 0 之后就通了。
      #
      # 曾自 v4.0.0-beta.6 起因前序发行版提交 SHA 不在本地历史中而失败（"Could not find the SHA of
      # the previous release"，#166）；增加 --ignore-missing 容忍前序 SHA 缺失（回退关联最近提交）。
      #
      # 仍然保留 continue-on-error 与独立 step：SCM 集成是 Sentry 侧的配置，随时可能被改动
      # 或失效，而它失效时不该拖累 release 本身（new/finalize/deploy 各自独立完成）。非零退出时
      # 输出 ::warning:: 并将告警追加写入 $env:GITHUB_STEP_SUMMARY 后以原退出码 exit，避免失败
      # 在作业摘要里静默不可见（#166）。
      #
      # 实测 beta.24 关联到 **20 个 commit / 47 个文件**。别被 cli 输出的那张表骗了 ——
      # 它只打 repo 与 HEAD 的 revision，**真正的区间是服务端算的**：从上一个有 commit 关联的
      # release 到本次。找不到上一个时（beta.23 就没有）它退回默认条数，而不是只关联一条。
      #
      # 有了这层关联，issue 页就能出 Suspect Commits —— Sentry 会指出崩溃最可能由哪个 commit
      # 引入。这是 telemetry 从「知道崩了」到「知道谁弄崩的」的那一步。
      - name: Associate commits to Sentry release
        if: env.PUBLISH == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ env.PUBLISH == 'true' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          if (-not $env:SENTRY_CLI) {
            Write-Output '::error::sentry-cli was not installed and verified (see Install sentry-cli).'
            exit 1
          }
          & $env:SENTRY_CLI releases set-commits $env:VERSION --auto --ignore-missing
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            Write-Output "::warning::Sentry commit association failed (exit $code); release $env:VERSION has no associated commits."
            if ($env:GITHUB_STEP_SUMMARY) {
              @(
                "### Warning: Sentry commit association failed"
                ""
                "- Release ``$env:VERSION``: commit association exited with code $code."
                "- Release publishing was not blocked, but Suspect Commits will be unavailable in Sentry."
              ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            }
            exit $code
          }

      - name: Finalize Sentry release
        if: env.PUBLISH == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ env.PUBLISH == 'true' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          if (-not $env:SENTRY_CLI) {
            Write-Output '::error::sentry-cli was not installed and verified (see Install sentry-cli).'
            exit 1
          }
          # finalize 失败则不 deploy（同迁移前的 set -euo pipefail）。
          & $env:SENTRY_CLI releases finalize $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          # deploy 的 environment 与 event 的 environment 是**两回事**：
          #   - 这里的 deploy：让 Sentry UI 知道「这个 release 部署到了 production」
          #   - event 的：由客户端 SDK 设（telemetry.environmentFor），semver tag → production
          # 两边都用 production 保持一致；对不上的话 UI 里会出现「部署到 X 但事件来自 Y」。
          & $env:SENTRY_CLI deploys new -r $env:VERSION -e production
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
