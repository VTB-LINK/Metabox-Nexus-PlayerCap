name: Sync Source To Dotcom

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Source tag to sync, for example v3.0.0-beta.5'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-source:
    runs-on: [self-hosted, Linux]
    environment: source-sync-production
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      TARGET_REPO_OWNER: VTB-LINK
      TARGET_REPO_NAME: Metabox-Nexus-PlayerCap
      TARGET_BRANCH: main
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GH_TOKEN: ${{ secrets.GH_DOTCOM_TOKEN }}
      GITEE_REPO_OWNER: VTB-LINK
      GITEE_REPO_NAME: Metabox-Nexus-PlayerCap
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Sync tagged snapshot to github.com main
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing secret GH_DOTCOM_TOKEN"
            exit 1
          fi

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::Missing secret GITEE_TOKEN"
            exit 1
          fi

          TARGET_REPO="${TARGET_REPO_OWNER}/${TARGET_REPO_NAME}"

          SNAPSHOT_DIR="$(mktemp -d)"
          TARGET_DIR="$(mktemp -d)"
          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"

          echo "Exporting snapshot for tag ${TAG_NAME}..."
          git archive --format=tar "${TAG_NAME}" | tar -xf - -C "${SNAPSHOT_DIR}"

          echo "Removing documents from the snapshot (keeping README.md, CONFIG.README.md, doc/title.png, doc/openapi.yaml and doc/release/README.html)..."
          find "${SNAPSHOT_DIR}" -type f -name '*.md' ! -path "${SNAPSHOT_DIR}/README.md" ! -path "${SNAPSHOT_DIR}/CONFIG.README.md" -delete
          rm -rf "${SNAPSHOT_DIR}/agent-doc"
          # doc/release/README.html 是随包使用说明，player/qqmusic 的版本清单门禁读它，镜像里须保留，否则从镜像检出后
          # 该包的测试失败（#215）。它所在的目录也须排除：find -delete 删不掉非空目录，报错即令本步失败。
          if [ -d "${SNAPSHOT_DIR}/doc" ]; then
            find "${SNAPSHOT_DIR}/doc" -mindepth 1 ! -path "${SNAPSHOT_DIR}/doc/title.png" ! -path "${SNAPSHOT_DIR}/doc/openapi.yaml" ! -path "${SNAPSHOT_DIR}/doc/release" ! -path "${SNAPSHOT_DIR}/doc/release/README.html" -delete
          fi

          echo "Cloning target repository main branch..."
          git clone --branch "${TARGET_BRANCH}" --single-branch "${TARGET_URL}" "${TARGET_DIR}"

          cd "${TARGET_DIR}"
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"

          echo "Replacing tracked content with tagged snapshot..."
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${SNAPSHOT_DIR}/." .

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected for ${TAG_NAME}; reusing current ${TARGET_BRANCH} HEAD."
            TARGET_COMMIT="$(git rev-parse HEAD)"
          else
            git commit -m "sync: source snapshot for ${TAG_NAME}"

            echo "Pushing snapshot commit to ${TARGET_REPO}:${TARGET_BRANCH}..."
            git push origin "${TARGET_BRANCH}"

            TARGET_COMMIT="$(git rev-parse HEAD)"
          fi

          echo "Updating tag ${TAG_NAME} to ${TARGET_COMMIT} on ${TARGET_REPO}..."
          git tag -f "${TAG_NAME}" "${TARGET_COMMIT}"
          git push origin "refs/tags/${TAG_NAME}" --force

          # Gitee 镜像与 dotcom 共用同一条快照历史，同一批提交与 tag 原样推过去。main 不强制推：
          # 与 dotcom 分叉即失败。tag 强制推：release.yml 的 Gitee 一步若先到，会从 Gitee main 建出
          # 这个 tag，须改指到快照提交。重跑幂等：dotcom 已推过则走上面的 No changes，这里再推一次。
          # Gitee 的令牌用户名须为 oauth2，写 x-access-token 会被拒（403）。
          GITEE_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO_OWNER}/${GITEE_REPO_NAME}.git"
          echo "Pushing ${TARGET_BRANCH} and tag ${TAG_NAME} to Gitee ${GITEE_REPO_OWNER}/${GITEE_REPO_NAME}..."
          git push "${GITEE_URL}" "${TARGET_BRANCH}"
          git push "${GITEE_URL}" "refs/tags/${TAG_NAME}" --force

          echo "Source sync completed for tag ${TAG_NAME}."
