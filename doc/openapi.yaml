openapi: 3.1.0
info:
  title: Metabox-Nexus-PlayerCap API
  version: 3.0.0-beta.1
  description: |
    VTB-TOOLS Metabox-Nexus-PlayerCap 多播放器歌词捕获服务 API。除 JSON 接口外另有两条二进制 WebSocket 通道：音频波形 `/audio-ws`（帧格式见该接口）与网易云特效镜像 `/cloudmusicv3/effect-ws`（二进制 JPEG 帧加 JSON 文本状态，本文档未单列接口）。

    **多播放器架构：** HTTP 响应与 `/ws`、`/{player}/ws`、SSE 的 JSON 事件均包含 `player` 字段，标识数据来源的播放器；音频波形帧内携带 `player`。当前五家：`"wesing"`（全民K歌）、`"cloudmusicv3"`（网易云音乐 v3）、`"qqmusic"`（QQ 音乐）、`"kugou"`（酷狗音乐）、`"sodamusic"`（汽水音乐）。**五家的能力不一致**，逐字与翻译的差异见各字段说明。

    **空数据约定：** 所有事件在无数据时统一返回 `"data": {}`（空对象），而非 `null`。

    **Per-player 端点：** 除 `/health-check`、`/service-status` 与 `/cloudmusicv3/effect-*` 外，所有端点均有播放器专属路径版本（如 `/wesing/ws`、`/cloudmusicv3/all_lyrics`、`/sodamusic/ws`、`/wesing/audio-ws`）。根端点跟随活跃播放器，Per-player 端点始终返回指定播放器数据。

    **Root WS 空闲态：** 当客户端连入根端点 `/ws` 且当前没有活跃播放器时，服务端会立即发送一个 `player_clear` 初始事件，而不是静默不输出。

servers:
  - url: http://localhost:8765
    description: 本地开发服务器

tags:
  - name: 系统
    description: 健康检查和服务状态
  - name: 歌词
    description: 歌词相关接口（完整歌词列表、当前歌词）
  - name: 状态
    description: 播放状态查询
  - name: 歌曲信息
    description: 歌曲元数据（名称、歌手、封面等）
  - name: SSE推送
    description: Server-Sent Events 实时推送接口
  - name: WebSocket
    description: WebSocket 实时推送接口（客户端无需发送消息）

paths:
  # ============================================================
  # 全局端点（无 player 参数）
  # ============================================================
  /health-check:
    get:
      tags: [系统]
      summary: 健康检查
      operationId: healthCheck
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthCheckData"
              examples:
                success:
                  summary: 成功
                  value:
                    code: 0
                    msg: success
                    player: internal
                    data:
                      now_time: "2026-03-19T12:34:56+08:00"

  /service-status:
    get:
      tags: [系统]
      summary: 服务状态信息
      operationId: serviceStatus
      description: |
        返回完整的服务状态信息，包括版本、配置、播放器状态、已连接客户端等。

        **version 说明：**
        - 编译时通过 `-ldflags "-X main.Version=3.0.0-beta.1"` 注入
        - 默认值为 `0.0.0`
        - `tag_name` 使用完整 semver；若 release 标题以 `-force` 结尾，则客户端允许强制同步到更低版本

        **config_sources 说明：**
        - 实际生效的配置来源列表。成功加载 `config.yml` 时其值为 `config.yml`（`内置默认` 已被它取代、不再出现在列表中）；`config.yml` 读取或 YAML 解析失败时仍为 `内置默认`；命令行覆盖了任何键时追加 `命令行参数`。为未设键兜底的内置默认不体现在此列表
        - 可能的值：`"内置默认"`、`"config.yml"`、`"命令行参数"`

        **config 与 config_effective 说明：**
        - 两者键集合与顺序相同：全局键 `addr`、`offset`、`poll`、`prior-player`、`prior-player-expire`、`per-player-idle-hide`、`audio-normalize`、`audio-normalize-target`、`audio-normalize-max-gain`、`cloudmusicv3-effect-strategy`，随后每个播放器（按 `player_support` 顺序）`<player>-offset`、`<player>-poll`、`<player>-idle-hide`、`<player>-audio-normalize`
        - `config` 为配置写下的值：按「播放器覆盖 → 全局 → 内置默认」解析继承，不做钳制或纠正。越界的数值与非法的 `cloudmusicv3-effect-strategy` 字符串按原值回显；类型错误等解析不出值的键视同未设置
        - `config_effective` 为运行时实际生效的值，计入配置层钳制（`poll` 与 `<player>-poll` 钳到 [10,2000]，`audio-normalize-target` 钳到 [-60,0]，`audio-normalize-max-gain` 钳到 [0,45]）、非法值回退、播放器层轮询下限（`cloudmusicv3` 低于 50 抬到 100，`qqmusic` 低于 30 抬到 50，`sodamusic` 低于 200 抬到 200）与 Windows 11 下 `park` 强制改为 `fadeout`
        - 某键在两者中取值不同，即写下的值未按原样生效

        **config_overwritten 说明：**
        - 列出被更高优先级来源覆盖的配置键名，按 `config` 的键顺序
        - 写下但未被采纳的值（如非法的 `cloudmusicv3-effect-strategy`）不计入；被钳制的值仍计入
        - 仅在有覆盖时出现非空数组

        **player_support 说明：**
        - 系统编译时注册的所有播放器标识名列表

        **player_running 说明：**
        - 当前正在运行（非 `offline` / `standby` / `waiting_process`）的播放器列表

        **player_status 说明：**
        - 所有支持的播放器及其当前状态（按注册顺序），值为 status 字符串
        - 可能的状态值：`"offline"`（服务端兜底：从未上报过状态）/ `"waiting_process"` / `"waiting_song"` / `"playing"` / `"paused"` / `"standby"` / `"error"`（仅 kugou 故障终态）。`"loading"` 为保留值，当前版本不会出现
        - 注意 `"error"` 不在 `player_running` 的排除集内，故障中的 kugou 仍会出现在 `player_running` 里

        **ws_connected 说明：**
        - 仅统计 `/ws` 与 `/{player}/ws` 的连接；SSE、`effect-ws`、`audio-ws` 连接不计入
        - `connected` - 布尔值，表示是否存在上述连接
        - `clients` - 字符串数组，上述连接的客户端地址列表（RemoteAddr 格式）

        **endpoints 说明：**
        - 返回所有可用接口的完整地址（含 Per-player 端点）
        - WebSocket 使用 `ws://`，HTTP/SSE 使用 `http://`
        - `audio-ws` 为音频波形二进制通道：根级条目跟随活跃播放器，各播放器子对象内的条目固定为该播放器
