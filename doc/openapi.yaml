  # ============================================================
  # 根端点（跟随活跃播放器）
  # ============================================================
  /all_lyrics:
    get:
      tags: [歌词]
      summary: 完整歌词列表
      operationId: getAllLyrics
      description: |
        返回当前活跃播放器正在播放歌曲的完整歌词列表。

        - `player` - 数据来源播放器（根端点时为当前活跃播放器）
        - `duration` - 歌曲总时长（秒）
        - `position` - 整曲实时播放位置（秒），= `progress × duration`，用于前端插值计时的初始锚点。逐行的播出时间见 `lyrics[].play_time`
        - `progress` - 当前播放进度（0-1），与 `lyric_update.progress` 同类型
        - `count` - 歌词行数
        - `lyrics` - 按 index 排序的歌词数组
        - `lyrics[].timestamp` - 该歌词行的原始起始时间（秒）
        - `lyrics[].play_time` - 该歌词行应用 offset 后的展示时间（秒）
        - `lyrics[].sub_text` - 翻译歌词文本；cloudmusicv3、qqmusic、kugou、sodamusic 提供，wesing 恒为空字符串。kugou 的翻译取自 KRC 内嵌的中文译轨、按行号对齐，回落行级 LRC、或该行无译文时为空；sodamusic 的翻译是平台单独下发的 tlyric LRC（`translations.cn`）、按绝对时间戳对齐，该曲无译轨或该行未被译轨覆盖（间奏等）时为空
        - `lyrics[].roma_text` - 逐行音译（发音标注）歌词文本；cloudmusicv3（网易云 romalrc，罗马音）、qqmusic（QQ QRC 逐字罗马音）与 kugou（KRC 内嵌 type=0 轨、按行号对齐，形态因语言而异：日文罗马音、韩文汉语谐音）提供，均与翻译 sub_text 相互独立、互不覆盖，该曲无音译轨或该行未被覆盖时为空；sodamusic 平台自身无音译源，改由酷狗歌词接口按歌名 + 时长匹配「借」音译补全（非平台原生、不保证稳定：跨平台歌名搜索可能搜不到对应曲、或匹配到不同版本 / 母带 / 翻唱，匹配失败、无对应曲或该行主歌词文本对不上时留空）；wesing 恒为空字符串
        - `lyrics[].text_detailed` - 逐字/细粒度歌词扩展（含 timestamp、play_time、duration、words[]）；无逐字数据时为空对象 `{}`
        - `lyrics_detailed` - 完整逐字歌词集合（仅包含有逐字数据的行）。cloudmusicv3（YRC）/ qqmusic（QRC）/ kugou（KRC）/ sodamusic（明文 KRC）提供逐字时有内容；kugou 回落到行级 LRC 时、以及 wesing（无逐字源），恒为 `[]`。sodamusic 无行级回落，故它的 `lyrics_detailed` 要么与 `lyrics` 等长，要么两者同时为空
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/AllLyricsData"
                          - $ref: "#/components/schemas/EmptyObject"
              examples:
                有歌词时:
                  summary: 有歌词时（cloudmusicv3，YRC 逐字 + 翻译）。示例已裁剪，只删元素不改值：lyrics 实际 88 行（此处留 2）、lyrics_detailed 实际 88 项（留 1）、每行 words 实际 6-8 个（留 2）。故 count 与数组长度对不上，真实响应中两者一致。
                  value:
                    code: 0
                    msg: success
                    player: cloudmusicv3
                    data:
                      title: "Cold - Maroon 5 / Future"
                      duration: 234.308
                      position: 0
                      progress: 0
                      count: 88
                      lyrics:
                        - index: 0
                          timestamp: 3.6100001
                          play_time: 3.1100001
                          text: "Cold enough to chill my bones"
                          sub_text: "冷得足以冻到我的骨头"
                          roma_text: ""
                          text_detailed:
                            timestamp: 4.44
                            play_time: 3.94
                            duration: 3.48
                            words:
                              - { timestamp: 4.44, play_time: 3.94, duration: 1.08, text: "Cold " }
                              - { timestamp: 5.52, play_time: 5.02, duration: 0.36, text: "enough " }
                        - index: 1
                          timestamp: 7.57
                          play_time: 7.07
                          text: "It feels like I don't know you anymore"
                          sub_text: "感觉就像我已经不再认识你了"
                          roma_text: ""
                          text_detailed:
                            timestamp: 7.92
                            play_time: 7.42
                            duration: 3.48
                            words:
                              - { timestamp: 7.92, play_time: 7.42, duration: 0.06, text: "It " }
                              - { timestamp: 7.98, play_time: 7.48, duration: 0.3, text: "feels " }
                      lyrics_detailed:
                        - lyric_index: 0
                          timestamp: 4.44
                          play_time: 3.94
                          duration: 3.48
                          text: "Cold enough to chill my bones"
                          words:
                            - { timestamp: 4.44, play_time: 3.94, duration: 1.08, text: "Cold " }
                            - { timestamp: 5.52, play_time: 5.02, duration: 0.36, text: "enough " }
                有歌词时（sodamusic，明文 KRC 逐字）:
                  summary: 中途接入 sodamusic（真实录音）。示例已裁剪，只删元素不改值：lyrics 实际 35 行（此处留 1）、lyrics_detailed 实际 35 项（留 1）、每行 words 实际 6 个（留 3），故 count 与数组长度对不上，真实响应中两者一致。注意 sodamusic 的 title 是「歌手 - 歌名」（同 kugou，与 wesing / cloudmusicv3 / qqmusic 相反）；lyrics_detailed 与 lyrics 等长（它无行级回落）。
                  value:
                    code: 0
                    msg: success
                    player: sodamusic
                    data:
                      title: "今晚吃什么呢 - 代替我（Tonight）"
                      duration: 193.65599
                      position: 102.935074
                      progress: 0.5315357
                      count: 35
                      lyrics:
                        - index: 0
                          timestamp: 0.09
                          play_time: 0
                          text: "谁能够代替我"
                          sub_text: ""
                          roma_text: ""
                          text_detailed:
                            timestamp: 0.09
                            play_time: 0
                            duration: 1.29
                            words:
                              - { timestamp: 0.09, play_time: 0, duration: 0.23, text: "谁" }
                              - { timestamp: 0.32, play_time: 0.11999999, duration: 0.18, text: "能" }
                              - { timestamp: 0.5, play_time: 0.3, duration: 0.18, text: "够" }
                      lyrics_detailed:
                        - lyric_index: 0
                          timestamp: 0.09
                          play_time: 0
                          duration: 1.29
                          text: "谁能够代替我"
                          words:
                            - { timestamp: 0.09, play_time: 0, duration: 0.23, text: "谁" }
                            - { timestamp: 0.32, play_time: 0.11999999, duration: 0.18, text: "能" }
                            - { timestamp: 0.5, play_time: 0.3, duration: 0.18, text: "够" }
                无歌词时:
                  summary: 平台未返回歌词（cloudmusicv3 纯音乐）。data 不是空对象——lyrics 为空数组、count 为 0，而 title/duration 照常有值。
                  value:
                    code: 0
                    msg: success
                    player: cloudmusicv3
                    data:
                      title: "Sunset - Klonopin"
                      duration: 180
                      position: 0
                      progress: 0
                      count: 0
                      lyrics: []
                      lyrics_detailed: []

  /lyric_update:
    get:
      tags: [歌词]
      summary: 当前歌词（最新一条）
      operationId: getLyricUpdate
      description: |
        返回当前活跃播放器正在播放的最新一行歌词。

        - `index` - 歌词行号；`-1` 表示平台未返回可用歌词数据（见下方说明）
        - `text` - 主歌词文本
        - `sub_text` - 翻译歌词文本；cloudmusicv3、qqmusic、kugou、sodamusic 提供，wesing 恒为空字符串。kugou 的翻译取自 KRC 内嵌的中文译轨、按行号对齐，回落行级 LRC、或该行无译文时为空；sodamusic 的翻译是平台单独下发的 tlyric LRC（`translations.cn`）、按绝对时间戳对齐，该曲无译轨或该行未被译轨覆盖（间奏等）时为空
        - `roma_text` - 逐行音译（发音标注）歌词文本；cloudmusicv3（网易云 romalrc，罗马音）、qqmusic（QQ QRC 逐字罗马音）与 kugou（KRC 内嵌 type=0 轨、按行号对齐，形态因语言而异：日文罗马音、韩文汉语谐音）提供，均与翻译 sub_text 相互独立、互不覆盖，该曲无音译轨或该行未被覆盖时为空；sodamusic 平台自身无音译源，改由酷狗歌词接口按歌名 + 时长匹配「借」音译补全（非平台原生、不保证稳定：跨平台歌名搜索可能搜不到对应曲、或匹配到不同版本 / 母带 / 翻唱，匹配失败、无对应曲或该行主歌词文本对不上时留空）；wesing 恒为空字符串
        - `timestamp` - 歌词时间戳（秒）
        - `play_time` - 本行歌词的上屏时间（秒）。基准为 `timestamp` - offset；若本行逐字首字早于行时间戳（典型是 cloudmusicv3 的 YRC 长引子行；kugou 与 sodamusic 的 KRC 字级偏移相对行首、首字即行首，不会提前），取首字时刻，此时 play_time 小于该基准。`index` 为 -1（无可显示歌词）时为 0
        - `position` - 整曲实时播放位置（秒），= `progress × duration`，每条都带、与 index 无关；与 `play_time`（本行播出时间）是两个量
        - `progress` - 整曲播放进度（0-1），= `position / 歌曲总时长`；与 `play_time`（本行歌词的播出时间）无换算关系
        - `text_detailed` - 逐字/细粒度歌词扩展（含 timestamp、play_time、duration、words[]）；无逐字数据时为空对象 `{}`

        **`index: -1` 纯音乐说明：**
        当平台未返回任何歌词数据时，发送 `index: -1` 而非空对象 `{}`。此时 `timestamp` 为 `0`，`sub_text` 与 `roma_text` 均为空字符串，`text_detailed` 为 `{}`；**`progress` 照常反映整曲播放进度，不为 `0`**（歌没有歌词，但它还在播）。
        **`text` 不保证为空**：cloudmusicv3 与 kugou 对纯音乐返回一行「纯音乐，请欣赏」，服务端已把 `index` 归一为 `-1`，但该提示语原样保留在 `text` 里；qqmusic 的 API 返回零行、以及 sodamusic 的平台未给出 KRC（`lyrics.type` 非 `krc` 或内容为空）时，`text` 为 `""`。提示语归一逻辑对五家统一生效，只是尚未观测到汽水发出这一行。
        判断有无歌词一律用 `index !== -1`，不要看 `text`。
        与此同时会发送一条 `all_lyrics`（`count: 0`，`lyrics: []`）。
        客户端利用 `msg.data.index === -1` 识别纯音乐，而非依赖 `msg.data.text`。
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/LyricUpdateData"
                          - $ref: "#/components/schemas/EmptyObject"
              examples:
                播放中:
                  summary: 播放中（wesing，此行无逐字）。wesing 的逐字来自进程内存的卡拉OK字级时间、逐行判定，时间轴不合法的行退回行级、text_detailed 为 {}（如本例）；wesing 无翻译，sub_text 恒空。
                  value:
                    code: 0
                    msg: success
                    player: wesing
                    data:
                      index: 1
                      text: "往事就像流星刹那划过心房"
                      sub_text: ""
                      roma_text: ""
                      timestamp: 31.483
                      play_time: 31.282999
                      position: 31.282999
                      progress: 0.105743244
                      text_detailed: {}
                播放中（逐字 + 翻译）:
                  summary: 播放中（cloudmusicv3，YRC 逐字 + 翻译，真实录音）。words 已裁剪至 2 个，实际 9 个——只删元素不改值。本行逐字首字（156.96）早于行时间戳（157.22），故 play_time 取首字时刻减 offset；position（整曲实时位置 156.4659）与 play_time（156.46）此处相差 0.006s。
                  value:
                    code: 0
                    msg: success
                    player: cloudmusicv3
                    data:
                      index: 37
                      text: "There's plenty of time to sleep when we die"
                      sub_text: "死后自会长眠。"
                      roma_text: ""
                      timestamp: 157.22
                      play_time: 156.46
                      position: 156.4659
                      progress: 0.62976056
                      text_detailed:
                        timestamp: 156.96
                        play_time: 156.46
                        duration: 7.02
                        words:
                          - { timestamp: 156.96, play_time: 156.46, duration: 0.18, text: "There's " }
                          - { timestamp: 157.14, play_time: 156.64, duration: 0.57, text: "plenty " }
                播放中（sodamusic，明文 KRC 逐字）:
                  summary: 播放中（sodamusic，真实录音）。words 已裁剪至 3 个，实际 14 个——只删元素不改值。KRC 的字级偏移相对行首、首字即行首，故 text_detailed.timestamp 恒等于行 timestamp、play_time 恒等于 timestamp 减 offset（此处 offset=200ms），不会像 cloudmusicv3 的 YRC 引子行那样提前。本曲无译轨，sub_text 为空。
                  value:
                    code: 0
                    msg: success
                    player: sodamusic
                    data:
                      index: 27
                      text: "谁能够代替我 漫步在宽阔的大路"
                      sub_text: ""
                      roma_text: ""
                      timestamp: 130.93
                      play_time: 130.73
                      position: 130.86787
                      progress: 0.675775
                      text_detailed:
                        timestamp: 130.93
                        play_time: 130.73
                        duration: 5.69
                        words:
                          - { timestamp: 130.93, play_time: 130.73, duration: 0.29, text: "谁" }
                          - { timestamp: 131.65, play_time: 131.45, duration: 0.29, text: "能" }
                          - { timestamp: 132.05, play_time: 131.85, duration: 0.29, text: "够" }
                尚无数据:
                  summary: 服务端还没有该播放器的歌词数据（播放器未启动，或启动后尚未播放）。这不是「本曲无歌词」——那种情况 data 是下面两例的完整对象。
                  value:
                    code: 0
                    msg: success
                    player: wesing
                    data: {}
                无可用歌词（qqmusic）:
                  summary: 平台返回零行歌词时 text 为空字符串。timestamp 为 0、play_time 为 0（无行可播出），而 position / progress 照常反映整曲播放位置（此例为中途接入，故非 0）。
                  value:
                    code: 0
                    msg: success
                    player: qqmusic
                    data:
                      index: -1
                      text: ""
                      sub_text: ""
                      roma_text: ""
                      timestamp: 0
                      play_time: 0
                      position: 28.151
                      progress: 0.12511556
                      text_detailed: {}
                无可用歌词（cloudmusicv3 / kugou）:
                  summary: 这两家对纯音乐返回一行「纯音乐，请欣赏」，服务端把 index 归一为 -1，但该提示语原样保留在 text 里——所以 index 为 -1 并不蕴含 text 为空。
                  value:
                    code: 0
                    msg: success
                    player: kugou
                    data:
                      index: -1
                      text: "纯音乐，请欣赏"
                      sub_text: ""
                      roma_text: ""
                      timestamp: 0
                      play_time: 0
                      position: 197.18834
                      progress: 0.6551108
                      text_detailed: {}

  /status_update:
    get:
      tags: [状态]
      summary: 播放状态
      operationId: getStatusUpdate
      description: |
        返回当前活跃播放器的播放状态。

        **status 可能的值及含义：**
        - `"waiting_process"` - 播放器进程未启动
        - `"waiting_song"` - 播放器已启动但未选择歌曲
        - `"loading"` - 保留值：当前版本各播放器均不产出此状态（wesing 的 loading 发送已停用，其余四家不产生），下游可不为它单独处理
        - `"playing"` - 播放中，`detail` 为歌曲标题。拼接顺序按播放器而异（wesing / cloudmusicv3 / qqmusic 为 `歌曲名 - 歌手`，kugou / sodamusic 为 `歌手 - 歌曲名`），详见 SongInfo.title
        - `"paused"` - 暂停中，`detail` 为歌曲标题。同时会收到一条 `playback_pause` 事件
        - `"standby"` - 待机状态。`detail` 按播放器而异：cloudmusicv3 为 `"网易云音乐已退出"` 或 `"网易云音乐 v<版本号> 不支持（需 v3+）"`（后者表示进程仍在运行、仅版本过低，该状态每 30 秒重发一次且不去重，版本号为实际读到的值）；qqmusic 为 `"QQ音乐已退出"`；wesing 为 `"K歌客户端已退出"`；kugou 为 `"酷狗音乐 CDP 已断开"`；sodamusic 为 `"汽水音乐 CDP 已断开"`。**kugou 例外**：切歌瞬间还会多发一条 `standby`、`detail` 是新歌标题，约 200 毫秒后即被 `song_info_update` 覆盖——这是当前实现的缺陷、不属契约，下游不应据此进入待机界面，可用「是否带 `reason`」来区分（真待机态带 `reason`，此缺陷态不带）
        - `"error"` - 故障终态，仅 kugou 会产生：`"未找到酷狗安装，已停止"` / `"酷狗 libcef.dll 版本不受支持，已停止"` / `"未取得管理员权限，已停止自动修复"`。`detail` 为具体原因，此后该播放器停止自动修复、不再变更状态

        **`reason`（稳定机器码，仅非歌名状态出现、永不本地化）**：下游应按它做逻辑判断，取代对 `detail` 中文的字面量匹配。取值：`process_not_running`（进程未启动/未连上）、`process_exited`（已退出）、`cdp_disconnected`（CDP 断开）、`window_not_open`（窗口未打开）、`version_unsupported`（版本不受支持）、`install_not_found`（未找到安装）、`no_admin`（无管理员权限）。playing/paused 时 `detail` 是歌名、不带 `reason`（`reason` 非空 ⟺ 非歌名状态）。另注：`detail` 现按系统显示语言本地化（中文系统中文、其余英文），供人读；机器判断一律用 `reason`。
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/StatusInfo"
                          - $ref: "#/components/schemas/EmptyObject"
              examples:
                播放中:
                  summary: 播放中
                  value:
                    code: 0
                    msg: success
                    player: wesing
                    data:
                      status: playing
                      detail: "晚风 - 陈婧霏"
                尚未获取到状态时:
                  summary: 尚未获取到状态时
                  value:
                    code: 0
                    msg: success
                    player: wesing
                    data: {}

  /song_info:
