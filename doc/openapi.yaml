        - `duration` - 歌曲总时长（秒）
        - `position` - 整曲实时播放位置（秒），= `progress × duration`，用于前端插值计时的初始锚点。逐行的播出时间见 `lyrics[].play_time`
        - `count` - 歌词行数
        - `lyrics` - 按 index 排序的歌词数组
      parameters:
        - $ref: "#/components/parameters/PlayerParam"
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
