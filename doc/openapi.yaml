  /{player}/lyric_update:
    get:
      tags: [歌词]
      summary: 当前歌词（指定播放器）
      operationId: getPlayerLyricUpdate
      description: |
        返回指定播放器正在播放的最新一行歌词。
        Per-player 端点始终返回指定播放器的数据，不受路由切换影响。

        - `index` - 歌词行号；`-1` 表示平台未返回可用歌词数据（见下方说明）
        - `text` - 主歌词文本
        - `sub_text` - 翻译歌词文本；cloudmusicv3、qqmusic、kugou、sodamusic 提供，wesing 恒为空字符串。kugou 的翻译取自 KRC 内嵌的中文译轨、按行号对齐，回落行级 LRC、或该行无译文时为空；sodamusic 的翻译是平台单独下发的 tlyric LRC（`translations.cn`）、按绝对时间戳对齐，该曲无译轨或该行未被译轨覆盖（间奏等）时为空
        - `roma_text` - 逐行音译（发音标注）歌词文本；cloudmusicv3（网易云 romalrc，罗马音）、qqmusic（QQ QRC 逐字罗马音）与 kugou（KRC 内嵌 type=0 轨、按行号对齐，形态因语言而异：日文罗马音、韩文汉语谐音）提供，均与翻译 sub_text 相互独立、互不覆盖，该曲无音译轨或该行未被覆盖时为空；sodamusic 平台自身无音译源，改由酷狗歌词接口按歌名 + 时长匹配「借」音译补全（非平台原生、不保证稳定：跨平台歌名搜索可能搜不到对应曲、或匹配到不同版本 / 母带 / 翻唱，匹配失败、无对应曲或该行主歌词文本对不上时留空）；wesing 恒为空字符串
        - `timestamp` - 歌词时间戳（秒）
        - `play_time` - 本行歌词的上屏时间（秒）。基准为 `timestamp` - offset；若本行逐字首字早于行时间戳（典型是 cloudmusicv3 的 YRC 长引子行；kugou 与 sodamusic 的 KRC 字级偏移相对行首、首字即行首，不会提前），取首字时刻，此时 play_time 小于该基准。`index` 为 -1（无可显示歌词）时为 0
        - `position` - 整曲实时播放位置（秒），= `progress × duration`，每条都带、与 index 无关；与 `play_time`（本行播出时间）是两个量
        - `progress` - 整曲播放进度（0-1），= `position / 歌曲总时长`；与 `play_time`（本行歌词的播出时间）无换算关系

        **`index: -1` 纯音乐说明：** 参见根端点 `/lyric_update` 的说明。
      parameters:
        - $ref: "#/components/parameters/PlayerParam"
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/LyricUpdateData"
                          - $ref: "#/components/schemas/EmptyObject"
              examples:
                播放中:
                  summary: 播放中（有歌词时）
                  value:
                    code: 0
                    msg: success
                    player: wesing
                    data:
                      index: 1
                      text: "往事就像流星刹那划过心房"
                      sub_text: ""
                      roma_text: ""
                      timestamp: 31.483
                      play_time: 31.282999
                      position: 31.282999
                      progress: 0.105743244
                      text_detailed: {}
                无歌词时:
                  summary: 无歌词时
                  value:
                    code: 0
                    msg: success
                    player: wesing
                    data: {}

  /{player}/status_update:
    get:
      tags: [状态]
      summary: 播放状态（指定播放器）
      operationId: getPlayerStatusUpdate
      description: |
        返回指定播放器的播放状态。
        Per-player 端点始终返回指定播放器的数据，不受路由切换影响。

        **status 可能的值及含义：**
        - `"waiting_process"` - 播放器进程未启动
        - `"waiting_song"` - 播放器已启动但未选择歌曲
        - `"loading"` - 保留值：当前版本各播放器均不产出此状态（wesing 的 loading 发送已停用，其余四家不产生），下游可不为它单独处理
        - `"playing"` - 播放中，`detail` 为歌曲标题。拼接顺序按播放器而异（wesing / cloudmusicv3 / qqmusic 为 `歌曲名 - 歌手`，kugou / sodamusic 为 `歌手 - 歌曲名`），详见 SongInfo.title
        - `"paused"` - 暂停中，`detail` 为歌曲标题。同时会收到一条 `playback_pause` 事件
        - `"standby"` - 待机状态。`detail` 按播放器而异：cloudmusicv3 为 `"网易云音乐已退出"` 或 `"网易云音乐 v<版本号> 不支持（需 v3+）"`（后者表示进程仍在运行、仅版本过低，该状态每 30 秒重发一次且不去重，版本号为实际读到的值）；qqmusic 为 `"QQ音乐已退出"`；wesing 为 `"K歌客户端已退出"`；kugou 为 `"酷狗音乐 CDP 已断开"`；sodamusic 为 `"汽水音乐 CDP 已断开"`。**kugou 例外**：切歌瞬间还会多发一条 `standby`、`detail` 是新歌标题，约 200 毫秒后即被 `song_info_update` 覆盖——这是当前实现的缺陷、不属契约，下游不应据此进入待机界面，可用「是否带 `reason`」来区分（真待机态带 `reason`，此缺陷态不带）
        - `"error"` - 故障终态，仅 kugou 会产生：`"未找到酷狗安装，已停止"` / `"酷狗 libcef.dll 版本不受支持，已停止"` / `"未取得管理员权限，已停止自动修复"`。`detail` 为具体原因，此后该播放器停止自动修复、不再变更状态
      parameters:
        - $ref: "#/components/parameters/PlayerParam"
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/StatusInfo"
                          - $ref: "#/components/schemas/EmptyObject"
              examples:
                播放中:
                  summary: 播放中
                  value:
                    code: 0
                    msg: success
                    player: wesing
                    data:
                      status: playing
                      detail: "晚风 - 陈婧霏"
                尚未获取到状态时:
                  summary: 尚未获取到状态时
                  value:
                    code: 0
                    msg: success
                    player: wesing
                    data: {}

