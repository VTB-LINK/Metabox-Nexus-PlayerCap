  /lyric_update-SSE:
    get:
      tags: [SSE推送]
      summary: 实时歌词推送
      operationId: lyricUpdateSSE
      description: |
        Server-Sent Events 实时歌词推送。

        **连接建立时：** 若服务端已缓存该播放器的 `lyric_update`，立即补发一条；**若尚无缓存（播放器未启动，或启动后还没推出第一行歌词），连接建立时不发送任何内容**，第一条会等到实际有歌词时才到达。本端点不会发送 `data:{}` 空对象。

        **初始补发（连接时已有缓存歌词，含逐字 `text_detailed`）：**
        ```
        data: {"type":"lyric_update","player":"cloudmusicv3","data":{"index":37,"text":"There's plenty of time to sleep when we die","sub_text":"死后自会长眠。","roma_text":"","timestamp":157.22,"play_time":156.46,"position":156.4659,"progress":0.62976056,"text_detailed":{"timestamp":156.96,"play_time":156.46,"duration":7.02,"words":[{"timestamp":156.96,"play_time":156.46,"duration":0.18,"text":"There's "},{"timestamp":157.14,"play_time":156.64,"duration":0.57,"text":"plenty "}]}}}
        ```

        **播放过程中，每当歌词更新时接收（本例该行无逐字，`text_detailed` 为 `{}`）：**
        ```
        data: {"type":"lyric_update","player":"wesing","data":{"index":2,"text":"灰暗的深夜 是寂寞的世界","sub_text":"","roma_text":"","timestamp":37.716,"play_time":37.516,"position":37.516,"progress":0.1268581,"text_detailed":{}}}
        ```

        **完整生命周期示例：**
        ```
        （连接建立，当前无歌词）
        data: {"type":"lyric_update","player":"wesing","data":{}}

        （用户开始播放歌曲）
        data: {"type":"lyric_update","player":"wesing","data":{"index":0,"text":"是冰冻的时分 已过夜深的夜晚","sub_text":"","roma_text":"","timestamp":25.44,"play_time":25.24,"position":25.24,"progress":0.08530405,"text_detailed":{}}}
        data: {"type":"lyric_update","player":"wesing","data":{"index":1,"text":"往事就像流星刹那划过心房","sub_text":"","roma_text":"","timestamp":31.483,"play_time":31.282999,"position":31.282999,"progress":0.105743244,"text_detailed":{}}}

        （切歌 — 服务端不发送清空消息，前端自行根据新歌数据重置显示）
        data: {"type":"lyric_update","player":"wesing","data":{"index":0,"text":"啊","sub_text":"","roma_text":"","timestamp":3.012,"play_time":2.812,"position":2.812,"progress":0.009628378,"text_detailed":{}}}
        ```

        **约束：**
        - 本端点只推送 `lyric_update`，**不推送 `all_lyrics`**。需要歌词全文请调用 `/all_lyrics`，或改用 WebSocket 端点
        - 载荷与 WebSocket 逐字节同构（含 `type` 字段）
        - 响应头 `Content-Type: text/event-stream; charset=utf-8`
        - 连接建立时，若已有缓存则补发一条当前状态；无缓存则不发送（不发 `data:{}`）
        - 响应头包含 `Access-Control-Allow-Origin: *`

        **客户端使用示例（JavaScript）：**
        ```javascript
        const eventSource = new EventSource('http://localhost:8765/lyric_update-SSE');

        eventSource.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          console.log(`[${msg.player}]`, msg.data.text || '(empty)');
        };
        ```
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSELyricUpdateEvent"
              examples:
                有歌词时:
                  summary: 有歌词时（含逐字 text_detailed；无逐字的行该字段为 {}）
                  value: |
                    data: {"type":"lyric_update","player":"cloudmusicv3","data":{"index":37,"text":"There's plenty of time to sleep when we die","sub_text":"死后自会长眠。","roma_text":"","timestamp":157.22,"play_time":156.46,"position":156.4659,"progress":0.62976056,"text_detailed":{"timestamp":156.96,"play_time":156.46,"duration":7.02,"words":[{"timestamp":156.96,"play_time":156.46,"duration":0.18,"text":"There's "},{"timestamp":157.14,"play_time":156.64,"duration":0.57,"text":"plenty "}]}}}
                无歌词时:
                  summary: 无歌词时
                  value: |
                    data: {"type":"lyric_update","player":"wesing","data":{}}

  /song_info-SSE:
    get:
      tags: [SSE推送]
      summary: 实时歌曲信息推送
      operationId: songInfoSSE
      description: |
        Server-Sent Events 实时歌曲信息推送。

        **连接建立时：** 若服务端已缓存该播放器的 `song_info_update`，立即补发一条；**若尚无缓存，连接建立时不发送任何内容**，第一条会等到实际获取到歌曲信息时才到达。本端点不会发送 `data:{}` 空对象。

        **初始补发（连接时已有缓存歌曲信息）：**
        ```
        data: {"type":"song_info_update","player":"wesing","data":{"name":"晚风","singer":"陈婧霏","title":"晚风 - 陈婧霏","cover":"http://imgcache.qq.com/music/photo/mid_album_800/r/k/003JA09X2m9xrk.jpg","cover_base64":"data:image/jpeg;base64,..."}}
        ```

        **播放过程中，歌曲切换时接收：**
        ```
        data: {"type":"song_info_update","player":"wesing","data":{"name":"High歌","singer":"黄龄","title":"High歌 - 黄龄","cover":"http://imgcache.qq.com/music/photo/mid_album_800/t/c/003ZgkGJ2DlCtc.jpg","cover_base64":"data:image/jpeg;base64,..."}}
        ```

        **歌曲结束/窗口关闭时：**
        ```
        data: {"type":"song_info_update","player":"wesing","data":{}}
        ```
        - 直接切歌（A→B）时，不会先发送空再发送 B，而是直接发送 B 的信息

        **约束：**
        - 载荷与 WebSocket 逐字节同构（含 `type` 字段）
        - 连接建立时，若已有缓存则补发一条当前状态；无缓存则不发送（不发 `data:{}`）
        - 响应头包含 `Access-Control-Allow-Origin: *`

        **客户端使用示例（JavaScript）：**
        ```javascript
        const eventSource = new EventSource('http://localhost:8765/song_info-SSE');

        eventSource.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.data && msg.data.title) {
            console.log(`♪ [${msg.player}] ${msg.data.title}`);
          }
        };
        ```
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSESongInfoUpdateEvent"
              examples:
                有歌曲信息时:
                  summary: 有歌曲信息时
                  value: |
                    data: {"type":"song_info_update","player":"wesing","data":{"name":"晚风","singer":"陈婧霏","title":"晚风 - 陈婧霏","cover":"http://imgcache.qq.com/music/photo/mid_album_800/r/k/003JA09X2m9xrk.jpg","cover_base64":"data:image/jpeg;base64,..."}}
                无歌曲信息时:
                  summary: 无歌曲信息时
                  value: |
                    data: {"type":"song_info_update","player":"wesing","data":{}}

  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket 连接（根端点，跟随活跃播放器）
      operationId: wsRoot
      description: |
        WebSocket 实时推送接口，客户端无需发送消息（发送的被忽略）。连接后跟随当前活跃播放器接收所有事件。

        > **注意：** 此端点实际为 WebSocket 协议（`ws://`），在 OpenAPI 中以 GET 方式描述。导入 Apifox 后请手动修改接口类型为 WebSocket。

        > **统一事件格式：** JSON 事件通道（`/ws`、`/{player}/ws` 与全部 SSE）的消息均使用 `{"type": "事件名", "player": "播放器名", "data": 载荷}` 格式；`/audio-ws`、`/{player}/audio-ws` 为二进制帧，`/cloudmusicv3/effect-ws` 为二进制 JPEG 帧加文本状态，均不适用。
        > 无数据时 `data` 为 `{}`（空对象）。**例外**：`all_lyrics` 在平台未返回歌词时仍是完整对象——`lyrics` 为空数组、`count` 为 0，而 `title` / `duration` 照常有值。
        > 下游客户端统一按 `msg.type` 分发，`msg.player` 识别来源，`msg.data` 读取载荷即可。

        > **初始化行为：** 若连入时存在活跃播放器，会按顺序补发该播放器当前缓存的 `status_update` → `song_info_update` → `all_lyrics` → `lyric_update`。**只补发缓存中已存在的类型**——某类型尚无缓存数据时，该条不发送（并非发一条 `data:{}`）。若连入时当前没有活跃播放器，则只收到一个 `player_clear` 初始事件。

        **连接建立时补发的缓存事件（下面逐一说明每种类型的格式）：**

        ---

        **1. `status_update` - 状态更新**

        有状态时：
        ```json
        {"type":"status_update","player":"wesing","data":{"status":"playing","detail":"晚风 - 陈婧霏"}}
        ```
        无状态时（服务刚启动尚未获取到状态）：
        ```json
        {"type":"status_update","player":"wesing","data":{}}
        ```

        status 可能的值及含义：
        - `"waiting_process"` - 播放器进程未启动
        - `"waiting_song"` - 播放器已启动但未选择歌曲
        - `"loading"` - 保留值：当前版本各播放器均不产出此状态（wesing 的 loading 发送已停用，其余四家不产生），下游可不为它单独处理
        - `"playing"` - 播放中，`detail` 为歌曲标题。拼接顺序按播放器而异（wesing / cloudmusicv3 / qqmusic 为 `歌曲名 - 歌手`，kugou / sodamusic 为 `歌手 - 歌曲名`），详见 SongInfo.title
        - `"paused"` - 暂停中，`detail` 为歌曲标题。同时会收到一条 `playback_pause` 事件
        - `"standby"` - 待机状态。`detail` 按播放器而异：cloudmusicv3 为 `"网易云音乐已退出"` 或 `"网易云音乐 v<版本号> 不支持（需 v3+）"`（后者表示进程仍在运行、仅版本过低，该状态每 30 秒重发一次且不去重，版本号为实际读到的值）；qqmusic 为 `"QQ音乐已退出"`；wesing 为 `"K歌客户端已退出"`；kugou 为 `"酷狗音乐 CDP 已断开"`；sodamusic 为 `"汽水音乐 CDP 已断开"`。**kugou 例外**：切歌瞬间还会多发一条 `standby`、`detail` 是新歌标题，约 200 毫秒后即被 `song_info_update` 覆盖——这是当前实现的缺陷、不属契约，下游不应据此进入待机界面，可用「是否带 `reason`」来区分（真待机态带 `reason`，此缺陷态不带）
        - `"error"` - 故障终态，仅 kugou 会产生：`"未找到酷狗安装，已停止"` / `"酷狗 libcef.dll 版本不受支持，已停止"` / `"未取得管理员权限，已停止自动修复"`。`detail` 为具体原因，此后该播放器停止自动修复、不再变更状态

        ---

        **2. `song_info_update` - 歌曲信息更新**

        有歌曲信息时：
        ```json
        {"type":"song_info_update","player":"wesing","data":{"name":"晚风","singer":"陈婧霏","title":"晚风 - 陈婧霏","cover":"http://imgcache.qq.com/music/photo/mid_album_800/r/k/003JA09X2m9xrk.jpg","cover_base64":"data:image/jpeg;base64,/9j/4AAQSkZJRg..."}}
        ```
        无歌曲信息时：
        ```json
        {"type":"song_info_update","player":"wesing","data":{}}
        ```

        **异步封面：** 部分播放器的封面 base64 通过异步 HTTP 下载获取。歌曲开始播放时会先发送一条**不含 `cover_base64`** 的 `song_info_update`（仅含 `cover` URL），待封面下载完成后再补发一条含 `cover_base64` 的完整版本。前端应使用最新收到的数据覆盖即可。

        ---

        **3. `lyric_update` - 实时歌词更新**

        播放中（有歌词时）：
        ```json
        {"type":"lyric_update","player":"wesing","data":{"index":1,"text":"往事就像流星刹那划过心房","sub_text":"","roma_text":"","timestamp":31.483,"play_time":31.282999,"position":31.282999,"progress":0.105743244,"text_detailed":{}}}
        ```
        无歌词时：
        ```json
        {"type":"lyric_update","player":"wesing","data":{}}
        ```

        ---

        **4. `all_lyrics` - 完整歌词列表**

        有歌词时：
        ```json
        {"type":"all_lyrics","player":"wesing","data":{"title":"都是夜归人 - 许美静","duration":296,"position":1.75,"progress":0.0059121624,"count":38,"lyrics":[{"index":0,"timestamp":25.44,"play_time":25.24,"text":"是冰冻的时分 已过夜深的夜晚","sub_text":"","roma_text":"","text_detailed":{}},{"index":1,"timestamp":31.483,"play_time":31.282999,"text":"往事就像流星刹那划过心房","sub_text":"","roma_text":"","text_detailed":{}},{"index":2,"timestamp":37.716,"play_time":37.516,"text":"灰暗的深夜 是寂寞的世界","sub_text":"","roma_text":"","text_detailed":{}}],"lyrics_detailed":[]}}（lyrics 已裁剪至 3 行，实际 38 行）
        ```
        无歌词时：
        ```json
        {"type":"all_lyrics","player":"wesing","data":{}}
        ```

        ---

        **5. `lyric_idle` - 歌词空闲通知**

        **仅 wesing 发送此事件**——cloudmusicv3 / qqmusic / kugou / sodamusic 不产生 `lyric_idle`，接这四家的下游不应等待它。

        wesing 在歌曲播放结束、切歌或窗口关闭时发送：
        ```json
        {"type":"lyric_idle","player":"wesing","data":{}}
        ```
        纯通知事件，`data` 始终为 `{}`。前端可自行决定是否响应。

        ---

        **6. `playback_pause` - 暂停播放**

        播放暂停时发送。`data.position` 为暂停时刻的整曲播放位置（秒），`data.progress` 为对应进度：
        ```json
        {"type":"playback_pause","player":"wesing","data":{"position":31.282999,"progress":0.105743244}}
        ```

        ---

        **7. `playback_resume` - 恢复播放 / 跳转**

        `position` 发生非连续跳变时发送，两种情形都会触发：从暂停中恢复播放；以及 seek / 拖动进度条。
        后者的 `position` 是**跳转后的新位置，可能小于上一次的值**。

        因此本事件**不保证与 `playback_pause` 成对出现**，实际收到的 `playback_resume` 通常多于 `playback_pause`。
        ```json
        {"type":"playback_resume","player":"wesing","data":{"position":37.516,"progress":0.1268581}}
        ```
        前端收到 `playback_pause` 应停止时间插值，收到 `playback_resume` 应以 `position` 为锚点重新开始插值。

        ---

        **8. `player_switch` - 播放器切换（仅根订阅者收到）**

        当活跃播放器发生变化时，根订阅者（`/ws`）会收到此事件：
        ```json
        {"type":"player_switch","player":"cloudmusicv3","data":{"from":"wesing","to":"cloudmusicv3"}}
        ```
        - `player` 字段为切换后的新播放器
        - `from` - 切换前的播放器标识名
        - `to` - 切换后的播放器标识名（为空字符串 `""` 时表示活跃播放器已清除，无播放器输出）
        - Per-player 订阅者（如 `/wesing/ws`）**不会**收到此事件
        - 当 `to` 非空时，紧随其后会收到新播放器的**已缓存**状态事件（`status_update` + `song_info_update` + `all_lyrics` + `lyric_update` 中已有的部分）

        ---

        **9. `player_clear` - 活跃播放器清除（根订阅者；per-player 通道在无活跃自动隐藏时也会收到）**

        当所有播放器都停止输出（全员 inert）时，根订阅者收到此事件，表示应清空显示：
        ```json
        {"type":"player_clear","player":"","data":{}}
        ```
        - **运行中**活跃播放器被清空时，与 `player_switch`(to="") 一起发送（双重通知，向后兼容）
        - **连接建立时**若当前已无活跃播放器，则作为初始事件单独发送（此时没有配对的 `player_switch`）
        - 前端应清空歌词、封面、进度等所有显示内容
        - Per-player 订阅者（如 `/wesing/ws`）默认**不**收到此事件；仅当为该播放器开启「无活跃自动隐藏」（`per-player-idle-hide` 或 `<player>-idle-hide` > 0）且静默超阈值时会收到一条（`player` 为该播放器名，且**不带**配对的 `player_switch`），用于隐藏歌停后停留的末行歌词

        ---

        **WS 完整生命周期示例**（取自真实录音，`lyrics` / `lyrics_detailed` 内容以 `...` 略去）：
        ```
        （客户端连入根端点 /ws，当前没有活跃播放器）
        ← {"type":"player_clear","player":"","data":{}}

        （wesing 开始播放，触发从「无活跃播放器」到 wesing 的切换）
        ← {"type":"player_switch","player":"wesing","data":{"from":"","to":"wesing"}}
        ← {"type":"status_update","player":"wesing","data":{"status":"playing","detail":"晚风 - 陈婧霏"}}
        ← {"type":"song_info_update","player":"wesing","data":{"name":"晚风","singer":"陈婧霏","title":"晚风 - 陈婧霏","cover":"http://imgcache.qq.com/music/photo/mid_album_800/r/k/003JA09X2m9xrk.jpg","cover_base64":""}}
        ← {"type":"all_lyrics","player":"wesing","data":{"title":"晚风 - 陈婧霏","duration":176,"position":0,"progress":0,"count":34,"lyrics":[...],"lyrics_detailed":[]}}

        （封面异步下载完成，补发第二条 song_info_update，此时 cover_base64 有值）
        ← {"type":"song_info_update","player":"wesing","data":{"name":"晚风","singer":"陈婧霏","title":"晚风 - 陈婧霏","cover":"http://imgcache.qq.com/music/photo/mid_album_800/r/k/003JA09X2m9xrk.jpg","cover_base64":"data:image/jpeg;base64,..."}}

        （随播放进度逐行推送 lyric_update，格式见 /lyric_update 端点）

        （用户暂停 / 恢复；resume 也可由拖动进度条触发）
        ← {"type":"playback_pause","player":"wesing","data":{"position":32.2,"progress":0.105743244}}
        ← {"type":"playback_resume","player":"wesing","data":{"position":32.25,"progress":0.1268581}}

        （wesing 歌曲播放结束 / 切歌 / 窗口关闭——lyric_idle 仅 wesing 发送）
        ← {"type":"lyric_idle","player":"wesing","data":{}}

        （K歌客户端退出）
        ← {"type":"status_update","player":"wesing","data":{"status":"standby","detail":"K歌客户端已退出"}}
        ```

        **客户端使用示例（JavaScript）：**
        ```javascript
        const ws = new WebSocket('ws://localhost:8765/ws');
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          switch (msg.type) {
            case 'status_update':
              if (msg.data && msg.data.status) {
                console.log(`[${msg.player}] 状态: ${msg.data.status} - ${msg.data.detail}`);
              }
              break;
            case 'song_info_update':
              if (msg.data && msg.data.title) {
                console.log(`[${msg.player}] ♪ ${msg.data.name} - ${msg.data.singer}`);
              }
              break;
            case 'all_lyrics':
              if (msg.data && msg.data.lyrics) {
                console.log(`[${msg.player}] 共 ${msg.data.count} 行歌词`);
              }
              break;
            case 'lyric_update':
              if (msg.data && msg.data.text) {
                console.log(`[${msg.player}] [${msg.data.index}] ${msg.data.text}`);
              }
              break;
            case 'lyric_idle':
              console.log(`[${msg.player}] 歌词空闲`);
              break;
            case 'playback_pause':
              console.log(`[${msg.player}] 暂停 @ ${msg.data.position}s`);
              break;
            case 'playback_resume':
              console.log(`[${msg.player}] 恢复 @ ${msg.data.position}s`);
              break;
            case 'player_switch':
              console.log(`播放器切换: ${msg.data.from} → ${msg.data.to}`);
              break;
          }
        };
        ```
      responses:
        "101":
          description: WebSocket 握手成功，协议升级

  /audio-ws:
    get:
      tags: [WebSocket]
      summary: 音频波形 WebSocket（根端点，跟随活跃播放器）
      operationId: audioWsRoot
      description: |
        实时音频波形帧流，跟随当前活跃播放器输出。

        > **注意：** 此端点实际为 WebSocket 协议（`ws://`），在 OpenAPI 中以 GET 方式描述。导入 Apifox 后请手动修改接口类型为 WebSocket。

        > **二进制帧，非 JSON 事件：** 与 `/ws` 的文本 JSON 事件（`{"type","player","data"}`）不同，本端点只发送 Binary 类型消息，每条消息恰为一帧完整的音频帧，不发送文本消息。全部字段为小端序，字段间无对齐填充。

        **帧格式（`version` = 1）：**

        | 偏移 | 长度 | 类型 | 字段 | 说明 |
        |---|---|---|---|---|
        | 0 | 4 | u32 | `magic` | 恒为 `0x56544157`（线上字节 `57 41 54 56`） |
        | 4 | 4 | u32 | `payloadLen` | 本字段之后的字节数，= 帧长 − 8；消费者可直接用消息长度 |
        | 8 | 4 | u32 | `version` | 线格式版本，当前为 1 |
        | 12 | 4 | u32 | `headerLen` | 定长头总长，即 `bins` 的起始偏移，恒为 4 的倍数；当前为 48 |
        | 16 | 4 | u32 | `flags` | 标志位，见下 |
        | 20 | 4 | u32 | `epoch` | 捕获段序号，见下 |
        | 24 | 8 | f64 | `ts` | 时间戳（毫秒），见下 |
        | 32 | 4 | f32 | `rms` | 均方根，线性值 |
        | 36 | 4 | f32 | `peakL` | 左声道（声道 0）sample peak，线性值 |
        | 40 | 4 | f32 | `peakR` | 右声道（声道 1）sample peak，线性值 |
        | 44 | 4 | u32 | `playerLen` | `player` 的字节数 |
        | `headerLen` | 4 × N | f32 × N | `bins` | 幅度谱；N = (帧长 − `headerLen` − `playerLen`) / 4 |
        | `headerLen` + 4 × N | `playerLen` | UTF-8 | `player` | 播放器标识名；根端点无活跃播放器时的空闲帧为空串 |

        - `flags`：bit0 为 1 表示该路已启用音量归一化，见「音量归一化」。其余位保留，服务端置 0，消费者应忽略。
        - `epoch`：捕获子进程每成功启动一路捕获即分配一个新值（进程内从 1 起递增）。同一捕获子进程内，同一 (`player`, `epoch`) 的帧来自同一次连续捕获，其 `ts` 单调递增。捕获重新开始（播放器重启、订阅或播放状态变化使该路被停止后再次启动、捕获子进程重启）时取新值；捕获子进程重启后从 1 重新计数，可能与重启前的值相同，此时以 `ts` 的跳变识别断点（重启期间改收空闲帧；看门狗判定子进程无响应而重启时不退避，间隔可能短于 1 秒）。不得假定 `epoch` 单调。空闲帧恒为 0。
        - `ts`：由 Windows `QueryPerformanceCounter` 换算的毫秒值（含小数部分），开机起算、系统级，与墙钟无关，仅用于帧间相对时间。跨 `player` 切换处不保证单调。
        - 本帧窗口指自上一帧（首帧为自捕获开始）以来捕获到的全部非静音采样。
        - `rms`：两声道取均值后、本帧窗口内最后至多 1024 个采样的均方根。
        - `peakL` / `peakR`：本帧窗口内全部采样在两声道取均值之前，声道 0 / 声道 1 的绝对值最大值（不做过采样）。与 `rms`、`bins` 只用最后至多 1024 个采样不同，峰值覆盖整个窗口，不漏瞬态。峰值不截断：采样值超出 [-1, 1] 时照实输出大于 1 的值。
        - `bins`：N = 512，第 i 个元素对应频率 i × 46.875 Hz（采样率 48000 Hz、1024 点 FFT、周期 Hann 窗），为线性幅度（非 dB）。未开启音量归一化且采样值在 [-1, 1] 内时，`rms`、`peakL`、`peakR` 与 `bins` 均不超过 1。服务端把采样中的 NaN 与 ±Inf 按 0 计入，这四项不会因此出现 NaN 或无穷大。

        **版本演进与校验：**
        - 兼容的新增字段一律追加在 `playerLen` 之后，同时增大 `headerLen`（保持 4 的倍数），`version` 不变。消费者读取自己认识的字段，再从 `headerLen` 处读取 `bins` 与 `player`，不受新增字段影响；因此 `headerLen` 须从帧内读取，不得写死为 48。
        - 改变已有字段的偏移、类型或语义等不兼容改动才升级 `version`。消费者遇到不认识的 `version`，整帧丢弃。
        - 帧长最小为 48 字节（即 `payloadLen` ≥ 40），空闲帧恰为此长度。接收方（含服务端内部的解码器）按以下顺序判定，任一成立即为坏帧、整帧丢弃：
          1. 帧长 < 48，在读取任何字段之前判定；
          2. `version` ≠ 1；
          3. `headerLen` < 48，或不是 4 的倍数，或大于帧长；
          4. `headerLen` + `playerLen` 大于帧长；
          5. 帧长 − `headerLen` − `playerLen` 不是 4 的倍数。

        **帧形态：**

        | 形态 | `player` | `epoch` | `flags` | `rms` / `bins` | `peakL` / `peakR` | 出现条件 |
        |---|---|---|---|---|---|---|
        | 音频帧 | 播放器名 | ≥ 1 | 该路启用归一化时 bit0 为 1，否则为 0 | 按本帧窗口计算的值，N = 512 | 本帧窗口的实测峰值 | 目标进程在本帧窗口内有非静音音频数据 |
        | 静音帧 | 播放器名 | ≥ 1 | 同音频帧 | 全为 0，N = 512 | 0 | 本帧窗口内无非静音数据：暂停、静音段；按 WASAPI 机制推断，播放器经 ASIO 或 WASAPI 独占模式输出（绕过系统混音）时亦然，未实测 |
        | 空闲帧 | 根端点无活跃播放器时为 `""`，否则为播放器名 | 0 | 0 | `rms` 为 0，N = 0 | 0 | 当前无音频捕获，每 100 毫秒一帧，见「收到空闲帧的情况」 |

        有音频数据时名义节拍约 33 毫秒（实测约 25 帧/秒）；目标进程不向系统音频引擎提交数据时，静音帧间隔约 100 毫秒。

        消费者以 N 区分有无捕获，两种端点规则相同：N = 0 为空闲帧，表示当前无音频捕获；N > 0 表示有捕获，`rms` 与 `bins` 全为 0 即静音；`epoch` 变化表示进入新的捕获段。

        **路由与切换：**
        - 根端点只转发当前活跃播放器的帧。活跃播放器变更（与 `/ws` 的 `player_switch` 由同一次变更触发）后，后续帧的 `player` 变为新播放器名，`epoch` 为该播放器自身捕获段的值。
        - 无活跃播放器（即 `/ws` 收到 `player_clear` 的状态）时，根端点持续推送 `player` 为空串的空闲帧；仅订阅本端点的消费者据此即可知道已清空，无需订阅 `/ws`。有活跃播放器而它无捕获时，根端点推送 `player` 为其名的空闲帧。
        - 活跃播放器暂停、尚未因 `prior-player-expire` 超时被清除时仍是活跃播放器：根端点继续转发它的帧（通常为静音帧），捕获正常时不推送空闲帧。

        **按需捕获：** 所有 `/audio-ws` 与 `/{player}/audio-ws` 均无连接时，服务端不扫描进程、不运行捕获子进程（例外：服务启动时无条件枚举一次进程，以清理上次运行遗留的捕获子进程）。有连接时，服务端捕获进程在运行的下列播放器：有 `/{player}/audio-ws` 连接的播放器（不论播放状态）；根端点有连接时的当前活跃播放器（含暂停中）以及所有状态为 `playing` 的播放器，后者使活跃播放器切换后新播放器的帧无需等待捕获启动。连接与断开约在 1.5 秒内反映到捕获上。

        **音量归一化：** 由 `config.yml` 的 `audio-normalize`（全局开关，默认 `true`）与 `<player>-audio-normalize`（按播放器覆盖，不设则跟随全局）控制；参数 `audio-normalize-target`（目标响度，dBFS，默认 -14，范围 [-60, 0]）与 `audio-normalize-max-gain`（增益上限，dB，默认 30，范围 [0, 45]）全局生效。对某播放器开启后，其音频帧的 `rms`、`peakL`、`peakR` 与全部 `bins` 乘以同一个随响度平滑变化的增益，值可能大于 1，服务端不钳制，显示时由消费者自行截断；此时 `peakL` / `peakR` 大于 1 不代表真实削波，需要判断真实削波的消费者应依据 `flags` bit0 区分。静音帧与空闲帧的数值不受影响。开启归一化的播放器，其每一帧（含静音帧）的 `flags` bit0 均为 1；空闲帧的 `flags` 恒为 0。各播放器开关不一致时，根端点在活跃播放器切换前后的数值尺度不同，消费者可据 `flags` bit0 的变化得知。

        **收到空闲帧的情况：** 连接期间，根端点与 `/{player}/audio-ws` 持续有帧：有捕获时为音频帧或静音帧，无捕获时每 100 毫秒一帧空闲帧；捕获停止后约 300 毫秒才判定为无捕获，转换期间最多约 400 毫秒无帧。根端点无活跃播放器时收到 `player` 为空串的空闲帧；此外，服务端约 300 毫秒内未收到目标播放器（根端点为当前活跃播放器，`/{player}/audio-ws` 为路径中的播放器）的音频帧或静音帧时，改推 `player` 为其名的空闲帧，直到捕获恢复。原因包括：
        - 连接建立后、捕获首次启动前（服务端约每 1.5 秒重新评估一次需要捕获的播放器，另加 WASAPI 激活耗时）
        - 目标播放器进程未运行或未被识别
        - 捕获子进程启动失败或自身崩溃后的退避期间：依次 1、2、4、8 秒（先稳定运行过则最长 16 秒）；看门狗判定子进程无响应而重启时不额外退避
        - 捕获子进程内某一路启动或读取失败而子进程仍在运行（如 WASAPI 激活失败）：任一正在捕获的播放器（含暂停中）约 2 秒没有音频帧或静音帧即记一次失败，按该播放器退避 1、2、4、8 秒重试，连续 5 次后放弃该播放器、直到其进程重启。若另有播放器仍在出帧，只停该路；若没有（如只有这一路在捕获），服务端无法区分单路失败与子进程无响应，会重启捕获子进程，但不计入子进程失败、不额外退避，其他播放器仍按各自节奏恢复
        - 累计 5 次子进程启动失败或启动后 10 秒内退出（不含看门狗发起的重启与无连接时的按需关闭；期间有一次存活满 10 秒即清零），包括某一个播放器的捕获反复导致子进程崩溃的情况：本次服务运行期间不再捕获任何播放器，直至服务重启
        - 系统低于 Windows 10 build 19041：进程级 loopback 要求该版本及以上，低于此版本时捕获无法启动

        若持续约 1 秒以上一帧都收不到，表示连接或服务端异常，而非捕获未就绪。

        **约束：**
        - 连接建立时不补发任何缓存帧
        - 客户端只读，发送的任何消息均被忽略
        - 服务端为每个连接最多缓存 8 帧，客户端读取不及时则丢弃最旧帧；单次写入 5 秒内未完成即断开连接
        - 帧在服务端已校验，客户端无需按 `magic` 重新同步

        **客户端使用示例（JavaScript）：**
        ```javascript
        const ws = new WebSocket('ws://localhost:8765/audio-ws');
        ws.binaryType = 'arraybuffer';
        ws.onmessage = (event) => {
          const buf = event.data; // 一条消息的 ArrayBuffer
          const v = new DataView(buf);
          if (v.getUint32(0, true) !== 0x56544157 || v.getUint32(8, true) !== 1) return;
          const hdr = v.getUint32(12, true), flags = v.getUint32(16, true);
          const epoch = v.getUint32(20, true), ts = v.getFloat64(24, true);
          const [rms, peakL, peakR] = new Float32Array(buf, 32, 3);
          const playerLen = v.getUint32(44, true);
          const n = (buf.byteLength - hdr - playerLen) / 4;
          const bins = new Float32Array(buf, hdr, n);
          const player = new TextDecoder().decode(new Uint8Array(buf, hdr + 4 * n, playerLen));
          if (n === 0) { /* 空闲帧：当前无音频捕获；根端点 player 为空串表示无活跃播放器 */ }
        };
        ```

        示例只检查 `magic` 与 `version`，服务端发出的帧均已通过上述校验；需要处理非服务端来源数据的消费者，应补全其余判定。

        示例以 `Float32Array` 视图直接读取 `rms`、`peakL`、`peakR` 与 `bins`，前提是 `buf` 为从偏移 0 开始的独立 ArrayBuffer：浏览器中设 `binaryType = 'arraybuffer'` 即满足。在 Node 中收到的若是 `Buffer`（如 `ws` 库默认的 `nodebuffer`），须先复制成独立 ArrayBuffer（`b.buffer.slice(b.byteOffset, b.byteOffset + b.byteLength)`）再解析：直接传入 `Buffer` 时 `DataView` 构造抛出 TypeError；直接传入其 `.buffer` 只有在 `byteOffset` 为 0 且该 ArrayBuffer 的 `byteLength` 恰等于消息长度时才正确，否则帧被丢弃或解错。`Float32Array` 按宿主字节序读取，常见平台（x86、ARM）均为小端，与线格式一致。
      responses:
        "101":
          description: WebSocket 握手成功，协议升级

