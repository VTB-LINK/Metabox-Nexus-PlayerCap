  /{player}/ws:
    get:
      tags: [WebSocket]
      summary: WebSocket 连接（指定播放器）
      operationId: wsPlayer
      description: |
        WebSocket 实时双向通信接口（指定播放器）。始终接收指定播放器事件，不受路由切换影响。

        > **注意：** 此端点实际为 WebSocket 协议（`ws://`），在 OpenAPI 中以 GET 方式描述。导入 Apifox 后请手动修改接口类型为 WebSocket。

        行为与根端点 `/ws` 相同，但：
        - 始终接收指定播放器的事件
        - **不会**收到 `player_switch`、`player_clear` 事件

        连接建立时按顺序补发该播放器缓存中已有的事件：`status_update` → `song_info_update` → `all_lyrics` → `lyric_update`。只补发已缓存的类型，尚无缓存的不发（也不发 `data:{}`）。
        后续实时事件类型：`status_update`、`song_info_update`、`lyric_update`、`all_lyrics`、`lyric_idle`、`playback_pause`、`playback_resume`。

        详细事件格式请参阅根端点 `/ws` 的描述。
      parameters:
        - $ref: "#/components/parameters/PlayerParam"
      responses:
        "101":
          description: WebSocket 握手成功，协议升级

# ============================================================
# WebSocket 事件（以 webhooks 描述服务端推送的事件结构）
# ============================================================
webhooks:
  status_update:
    post:
      tags: [WebSocket]
      summary: 状态更新事件
      operationId: onStatusUpdate
      description: |
        播放状态发生变化时推送。连接建立时，若已有缓存的状态则补发一次，否则不发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, player, data]
              properties:
                type:
                  type: string
                  const: status_update
                player:
                  type: string
                  example: wesing
                data:
                  oneOf:
                    - $ref: "#/components/schemas/StatusInfo"
                    - $ref: "#/components/schemas/EmptyObject"
            examples:
              有状态时:
                value:
                  type: status_update
                  player: wesing
                  data:
                    status: playing
                    detail: "晚风 - 陈婧霏"
              无状态时:
                value:
                  type: status_update
                  player: wesing
                  data: {}
      responses:
        "200":
          description: 事件已接收

  song_info_update:
    post:
      tags: [WebSocket]
      summary: 歌曲信息更新事件
      operationId: onSongInfoUpdate
      description: |
        歌曲信息发生变化时推送。连接建立时，若已有缓存则补发一次，否则不发。
        部分播放器的封面 base64 异步获取，会先发送不含 cover_base64 的版本，待下载完成后补发完整版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, player, data]
              properties:
                type:
                  type: string
                  const: song_info_update
                player:
                  type: string
                  example: wesing
                data:
                  oneOf:
                    - $ref: "#/components/schemas/SongInfo"
                    - $ref: "#/components/schemas/EmptyObject"
            examples:
              有歌曲信息时:
                value:
                  type: song_info_update
                  player: wesing
                  data:
                    name: "晚风"
                    singer: "陈婧霏"
                    title: "晚风 - 陈婧霏"
                    cover: "http://imgcache.qq.com/music/photo/mid_album_800/r/k/003JA09X2m9xrk.jpg"
                    cover_base64: "data:image/jpeg;base64,/9j/4AAQSkZJRg..."
              无歌曲信息时:
                value:
                  type: song_info_update
                  player: wesing
                  data: {}
      responses:
        "200":
          description: 事件已接收

  lyric_update:
    post:
      tags: [WebSocket]
      summary: 实时歌词更新事件
      operationId: onLyricUpdate
      description: |
        歌词行发生变化时推送。连接建立时，若已有缓存的歌词则补发一次，否则不发。

        **`index: -1` 纯音乐说明：**
        当平台未返回任何歌词数据时，发送 `index: -1`。此时 `data` 不为 `{}`，而是包含完整字段的对象：`timestamp: 0`、`sub_text: ""`，而 **`progress` 照常反映播放进度**；`text` 不保证为空（cloudmusicv3 / kugou 保留平台提示语「纯音乐，请欣赏」，qqmusic 与 sodamusic 为 `""`）。
        与此同时会发送一条 `all_lyrics`（`count: 0`，`lyrics: []`）。
        客户端利用 `msg.data.index === -1` 识别纯音乐。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, player, data]
              properties:
                type:
                  type: string
                  const: lyric_update
                player:
                  type: string
                  example: wesing
                data:
                  oneOf:
                    - $ref: "#/components/schemas/LyricUpdateData"
                    - $ref: "#/components/schemas/EmptyObject"
            examples:
              有歌词时:
                value:
                  type: lyric_update
                  player: wesing
                  data:
                    index: 1
                    text: "往事就像流星刹那划过心房"
                    sub_text: ""
                    timestamp: 31.483
                    play_time: 31.282999
                    position: 31.282999
                    progress: 0.105743244
                    text_detailed: {}
              无歌词时:
                value:
                  type: lyric_update
                  player: wesing
                  data: {}
              无可用歌词:
                summary: 平台未返回可用歌词。kugou / cloudmusicv3 对纯音乐会返回一行「纯音乐，请欣赏」，服务端把 index 归一为 -1 但保留该文本；qqmusic 返回零行、sodamusic 平台未给出 KRC 时 text 为 ""。timestamp 恒为 0、play_time 恒为 0（无行可播出），而 position / progress 照常反映整曲播放位置。
                value:
                  type: lyric_update
                  player: kugou
                  data:
                    index: -1
                    text: "纯音乐，请欣赏"
                    sub_text: ""
                    timestamp: 0
                    play_time: 0
                    position: 197.18834
                    progress: 0.6551108
                    text_detailed: {}
      responses:
        "200":
          description: 事件已接收

  all_lyrics:
    post:
      tags: [WebSocket]
      summary: 完整歌词列表事件
      operationId: onAllLyrics
      description: |
        新歌曲开始播放时推送完整歌词列表。连接建立时，若已有缓存则补发一次，否则不发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, player, data]
              properties:
                type:
                  type: string
                  const: all_lyrics
                player:
                  type: string
                  example: wesing
                data:
                  oneOf:
                    - $ref: "#/components/schemas/AllLyricsData"
                    - $ref: "#/components/schemas/EmptyObject"
            examples:
              有歌词时:
                value:
                  type: all_lyrics
                  player: wesing
                  data:
                    title: "都是夜归人 - 许美静"
                    duration: 296
                    position: 1.75
                    progress: 0.0059121624
                    count: 38
                    lyrics:
                      - { index: 0, timestamp: 25.44, play_time: 25.24, text: "是冰冻的时分 已过夜深的夜晚", sub_text: "", text_detailed: {} }
                      - { index: 1, timestamp: 31.483, play_time: 31.282999, text: "往事就像流星刹那划过心房", sub_text: "", text_detailed: {} }
                      - { index: 2, timestamp: 37.716, play_time: 37.516, text: "灰暗的深夜 是寂寞的世界", sub_text: "", text_detailed: {} }
                    lyrics_detailed: []
              无歌词时:
                value:
                  type: all_lyrics
                  player: wesing
                  data: {}
      responses:
        "200":
          description: 事件已接收

  lyric_idle:
    post:
      tags: [WebSocket]
      summary: 歌词空闲通知事件
      operationId: onLyricIdle
      description: |
        歌曲播放结束、切歌或窗口关闭时发送。纯通知事件，`data` 始终为 `{}`。
        服务端不会发送清空歌词数据的消息，前端可自行决定是否响应。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, player, data]
              properties:
                type:
                  type: string
                  const: lyric_idle
                player:
                  type: string
                  example: wesing
                data:
                  $ref: "#/components/schemas/EmptyObject"
            example:
              type: lyric_idle
              player: wesing
              data: {}
      responses:
        "200":
          description: 事件已接收

  playback_pause:
    post:
      tags: [WebSocket]
      summary: 暂停播放事件
      operationId: onPlaybackPause
      description: |
        播放暂停时发送。`data.position` 为暂停时刻的整曲播放位置（秒），`data.progress` 为对应进度。前端收到后应停止时间插值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, player, data]
              properties:
                type:
                  type: string
                  const: playback_pause
                player:
                  type: string
                  example: wesing
                data:
                  $ref: "#/components/schemas/PlaybackTimeInfo"
            example:
              type: playback_pause
              player: wesing
              data:
                position: 31.282999
                progress: 0.105743244
      responses:
        "200":
          description: 事件已接收

  playback_resume:
    post:
      tags: [WebSocket]
      summary: 恢复播放事件
      operationId: onPlaybackResume
      description: |
        `position` 发生非连续跳变时发送：从暂停恢复播放，或 seek / 拖动进度条（此时 `position` 可能小于上一次的值）。
        因此本事件不保证与 `playback_pause` 成对出现。前端收到后应以 `position` 为锚点重新开始插值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, player, data]
              properties:
                type:
                  type: string
                  const: playback_resume
                player:
                  type: string
                  example: wesing
                data:
                  $ref: "#/components/schemas/PlaybackTimeInfo"
            example:
              type: playback_resume
              player: wesing
              data:
                position: 37.516
                progress: 0.1268581
      responses:
        "200":
          description: 事件已接收

  player_switch:
    post:
      tags: [WebSocket]
      summary: 播放器切换事件
      operationId: onPlayerSwitch
      description: |
        活跃播放器发生变化时推送。仅根订阅者（`/ws`）收到此事件，Per-player 订阅者不会收到。
        紧随其后会收到新播放器的已缓存状态事件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, player, data]
              properties:
                type:
                  type: string
                  const: player_switch
                player:
                  type: string
                  description: 切换后的新播放器
                  example: cloudmusicv3
                data:
                  $ref: "#/components/schemas/PlayerSwitchInfo"
            example:
              type: player_switch
              player: cloudmusicv3
              data:
                from: wesing
                to: cloudmusicv3
      responses:
        "200":
          description: 事件已接收

  player_clear:
    post:
      tags: [WebSocket]
      summary: 活跃播放器清除事件
      operationId: onPlayerClear
      description: |
        所有播放器都停止输出（全员 inert）时推送。仅根订阅者（`/ws`）收到此事件。
        总是与 `player_switch`(to="") 一起发送（双重通知，向后兼容）。
        若客户端连入 `/ws` 时当前已经没有活跃播放器，也会立即收到这个初始事件。
        前端应清空歌词、封面、进度等所有显示内容。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, player, data]
              properties:
                type:
                  type: string
                  const: player_clear
                player:
                  type: string
                  description: 空字符串
                  example: ""
                data:
                  type: object
                  description: 空对象
            example:
              type: player_clear
              player: ""
              data: {}
      responses:
        "200":
          description: 事件已接收

# ============================================================
# 复用组件定义
# ============================================================
components:
  parameters:
    PlayerParam:
      name: player
      in: path
      required: true
      description: 播放器标识名
      schema:
        type: string
        enum:
          - wesing
          - cloudmusicv3
          - qqmusic
          - kugou
          - sodamusic
        example: wesing

  schemas:
    # ----------------------------------------------------------
    # 响应信封
    # ----------------------------------------------------------
    HTTPResponse:
      type: object
      required: [code, msg, player, data]
      properties:
        code:
          type: integer
          description: 状态码，0 表示成功
          example: 0
        msg:
          type: string
          description: 状态消息
          example: success
        player:
          type: string
          description: 数据来源播放器标识名（系统端点为 `"internal"`）
          example: wesing
        data:
          description: 响应载荷，无数据时为空对象 `{}`

    WSEvent:
      type: object
      required: [type, player, data]
      description: WebSocket / SSE 统一事件格式
      properties:
        type:
          type: string
          description: 事件类型名
          enum:
            - status_update
            - song_info_update
            - lyric_update
            - all_lyrics
            - lyric_idle
            - playback_pause
            - playback_resume
            - player_switch
            - player_clear
        player:
          type: string
          description: 数据来源播放器标识名
          example: wesing
        data:
          description: 事件载荷，无数据时为空对象 `{}`

    # ----------------------------------------------------------
    # 空对象
    # ----------------------------------------------------------
    EmptyObject:
      type: object
      description: 空对象 `{}`，表示无数据
      maxProperties: 0

    # ----------------------------------------------------------
    # 数据载荷
    # ----------------------------------------------------------
    HealthCheckData:
      type: object
      required: [now_time]
      properties:
        now_time:
          type: string
          format: date-time
          description: 当前服务器时间
          example: "2026-03-19T12:34:56+08:00"

    ServiceStatusData:
      type: object
      required: [version, addr, now_time, config_sources, config, config_overwritten, player_support, player_running, player_status, endpoints, client_count, ws_connected]
      properties:
        version:
          type: string
          description: 服务版本号（编译时通过 `-ldflags` 注入，默认值为 `0.0.0`）
          example: "3.0.0"
        addr:
          type: string
          description: 服务监听地址
          example: "0.0.0.0:8765"
        now_time:
          type: string
          format: date-time
          description: 当前服务器时间
          example: "2026-03-19T12:34:56+08:00"
        config_sources:
          type: array
          description: |
            实际生效的配置来源列表。存在 config.yml 时其值为 ["config.yml"]（内置默认被取代、不出现在列表），命令行覆盖任何键时追加 "命令行参数"。
            可能的值：`"内置默认"`、`"config.yml"`、`"命令行参数"`
          items:
            type: string
          example: ["config.yml", "命令行参数"]
        config:
          type: object
          description: 当前生效的配置项
          properties:
            addr:
              type: string
              example: "0.0.0.0:8765"
            offset:
              type: integer
              description: 全局歌词偏移量（毫秒）
              example: 200
            poll:
              type: integer
              description: 全局轮询间隔（毫秒）
              example: 30
            prior-player:
              type: array
              description: 优先播放器列表
              items:
                type: string
              example: ["wesing"]
            prior-player-expire:
              type: integer
              description: 优先播放器过期时间（秒）
              example: 15
            wesing-offset:
              type: integer
              description: wesing 歌词偏移量（毫秒）
              example: 200
            wesing-poll:
              type: integer
              description: wesing 轮询间隔（毫秒）
              example: 30
            cloudmusicv3-offset:
              type: integer
              description: cloudmusicv3 歌词偏移量（毫秒）
              example: 500
            cloudmusicv3-poll:
              type: integer
              description: cloudmusicv3 轮询间隔（毫秒）
              example: 30
            qqmusic-offset:
              type: integer
              description: qqmusic 歌词偏移量（毫秒）
              example: 200
            qqmusic-poll:
              type: integer
              description: qqmusic 轮询间隔（毫秒）
              example: 50
        config_overwritten:
          type: array
          description: 被更高优先级来源覆盖的配置键名列表
          items:
            type: string
          example: ["offset", "wesing-poll"]
        player_support:
          type: array
          description: 系统编译时注册的所有播放器标识名列表
          items:
            type: string
            enum:
              - wesing
              - cloudmusicv3
              - qqmusic
              - kugou
              - sodamusic
          example: ["wesing", "cloudmusicv3", "qqmusic", "kugou", "sodamusic"]
        player_running:
          type: array
          description: 当前正在运行（非 offline / standby / waiting_process）的播放器列表
          items:
            type: string
            enum:
              - wesing
              - cloudmusicv3
              - qqmusic
              - kugou
              - sodamusic
          example: ["wesing"]
        player_status:
          type: object
          description: |
            所有支持的播放器及其当前状态（按注册顺序）。
            可能的状态值：`"offline"`（服务端兜底：该播放器从未上报过状态）/ `"waiting_process"` / `"waiting_song"` / `"playing"` / `"paused"` / `"standby"` / `"error"`（仅 kugou，故障终态）。`"loading"` 为保留值，当前版本不会出现。
          additionalProperties:
            type: string
            enum: [offline, waiting_process, waiting_song, loading, playing, paused, standby, error]
          example:
            wesing: playing
            cloudmusicv3: waiting_process
            qqmusic: waiting_process
            kugou: waiting_process
            sodamusic: waiting_process
        endpoints:
          type: object
          description: |
            所有可用接口的完整地址（含 Per-player 端点）。
            WebSocket 使用 `ws://`，HTTP/SSE 使用 `http://`。
            结构为根端点地址 + 每个播放器的子对象。
        client_count:
          type: integer
          description: 当前已连接的客户端总数
          example: 2
        ws_connected:
          type: object
          description: WebSocket 连接状态
          required: [connected, clients]
          properties:
            connected:
              type: boolean
              description: 是否有客户端连接
              example: true
            clients:
              type: array
              description: 已连接的客户端 IP 地址列表（RemoteAddr 格式）
              items:
                type: string
              example: ["192.168.1.100:54321", "192.168.1.200:54322"]

    StatusInfo:
      type: object
      required: [status, detail]
      properties:
        status:
          type: string
          description: |
            播放状态。可能的值：
            - `"waiting_process"` - 播放器进程未启动
            - `"waiting_song"` - 播放器已启动但未选择歌曲
            - `"loading"` - 保留值：当前版本各播放器均不产出此状态（wesing 的 loading 发送已停用，其余四家不产生），下游可不为它单独处理
            - `"playing"` - 播放中，`detail` 为歌曲标题。拼接顺序按播放器而异（wesing / cloudmusicv3 / qqmusic 为 `歌曲名 - 歌手`，kugou / sodamusic 为 `歌手 - 歌曲名`），详见 SongInfo.title
            - `"paused"` - 暂停中，`detail` 为歌曲标题。同时会收到一条 `playback_pause` 事件
            - `"standby"` - 待机状态。`detail` 按播放器而异：cloudmusicv3 为 `"网易云音乐已退出"` 或 `"网易云音乐 v<版本号> 不支持（需 v3+）"`（后者表示进程仍在运行、仅版本过低，该状态每 30 秒重发一次且不去重，版本号为实际读到的值）；qqmusic 为 `"QQ音乐已退出"`；wesing 为 `"K歌客户端已退出"`；kugou 为 `"酷狗音乐 CDP 已断开"`；sodamusic 为 `"汽水音乐 CDP 已断开"`。**kugou 例外**：切歌瞬间还会多发一条 `standby`、`detail` 是新歌标题，约 200 毫秒后即被 `song_info_update` 覆盖——这是当前实现的缺陷、不属契约，下游不应据此进入待机界面，可用 `detail` 是否匹配上述固定文案来区分
            - `"error"` - 故障终态，仅 kugou 会产生：`"未找到酷狗安装，已停止"` / `"酷狗 libcef.dll 版本不受支持，已停止"` / `"未取得管理员权限，已停止自动修复"`。`detail` 为具体原因，此后该播放器停止自动修复、不再变更状态
          enum:
            - waiting_process
            - waiting_song
            - loading
            - playing
            - paused
            - standby
            - error
          example: playing
        detail:
          type: string
          description: 状态详情（歌曲标题或状态说明）
          example: "晚风 - 陈婧霏"

    SongInfo:
      type: object
      required: [name, singer, title, cover, cover_base64]
      properties:
        name:
          type: string
          description: 歌曲名称
          example: "晚风"
        singer:
          type: string
          description: 歌手名称
          example: "陈婧霏"
        title:
          type: string
          description: |
            歌曲标题。拼接顺序**按播放器而异**：wesing / cloudmusicv3 / qqmusic 为 `歌曲名 - 歌手`，
            而 **kugou / sodamusic 为 `歌手 - 歌曲名`**（如 `"Taylor Swift - Cruel Summer (伴奏)"`）。
            需要歌名与歌手时请直接读 `name` / `singer`，不要解析 `title`。
            歌手为空时：wesing / kugou / sodamusic 的 `title` 即 `name` 本身（不含分隔符），而 cloudmusicv3 / qqmusic 无条件拼接、会得到带尾随 ` - ` 的 `title`。需要歌名与歌手请直接读 `name` / `singer`。
            sodamusic 的 `singer` 是平台 `artists[]` 全部艺人名以 ` / ` 连接的结果（多艺人时 `title` 里会出现多个 ` / `）。
          example: "晚风 - 陈婧霏"
        cover:
          type: string
          description: 封面图片 URL
          example: "http://imgcache.qq.com/music/photo/mid_album_800/r/k/003JA09X2m9xrk.jpg"
        cover_base64:
          type: string
          description: |
            封面图片 Base64 编码。
            部分播放器的封面 base64 通过异步 HTTP 下载获取，歌曲开始播放时会先发送一条不含 cover_base64 的 song_info_update（仅含 cover URL），待封面下载完成后再补发一条含 cover_base64 的完整版本。前端应使用最新收到的数据覆盖即可。
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRg..."

    LyricUpdateData:
      type: object
      required: [index, text, sub_text, timestamp, play_time, position, progress, text_detailed]
      properties:
        index:
          type: integer
          description: |
            歌词行号。
            特殊值 `-1` 表示平台未返回任何可用歌词数据（并非等同于「纯音乐」）。此时 `data` 仍是完整对象、不是 `{}`：`sub_text` 为空、`timestamp` 为 `0`、`play_time` 为 `0`（无行可播出），而 `position` / `progress` 照常反映整曲播放位置；`text` 不保证为空（cloudmusicv3 与 kugou 保留平台的「纯音乐，请欣赏」提示语，qqmusic 与 sodamusic 为 `""`）。同时会配套发送一条 `all_lyrics`（`count: 0`、`lyrics: []`）。
            客户端用 `msg.data.index === -1` 判断有无歌词，不要依赖 `msg.data.text` 是否为空。
          example: 1
        text:
          type: string
          description: 主歌词文本
          example: "往事就像流星刹那划过心房"
        sub_text:
          type: string
          description: 翻译歌词文本；cloudmusicv3、qqmusic、kugou、sodamusic 提供，wesing 恒为空字符串。kugou 的翻译取自 KRC 内嵌的中文译轨、按行号对齐，回落行级 LRC、或该行无译文时为空；sodamusic 的翻译是平台单独下发的 tlyric LRC（`translations.cn`）、按绝对时间戳对齐，该曲无译轨或该行未被译轨覆盖（间奏等）时为空
          example: ""
        timestamp:
          type: number
          format: float
          description: 歌词时间戳（秒）
          example: 31.483
        play_time:
          type: number
          format: float
          description: 本行歌词的上屏时间（秒）。基准为 `timestamp` - offset；若本行逐字首字早于行时间戳（典型是 cloudmusicv3 的 YRC 长引子行），取首字时刻，play_time 小于该基准。它与整曲播放位置是两个量。`index` 为 -1（无可显示歌词）时为 0
          example: 31.282999
        position:
          type: number
          format: float
          description: 整曲实时播放位置（秒），每条 lyric_update 都带、与 index 无关。= progress × duration，不减 offset。与 play_time（本行播出时间）是两个量——常规行上二者相近，逐字长引子行上 play_time 会明显更小
          example: 31.282999
        progress:
          type: number
          format: float
          description: 整曲播放进度（0-1），= position / 歌曲总时长。与 play_time（本行歌词的播出时间）不是同一个量
          example: 0.105743244
        text_detailed:
          $ref: "#/components/schemas/LyricTextDetailed"

    LyricLine:
      type: object
      required: [index, timestamp, play_time, text, sub_text, text_detailed]
      properties:
        index:
          type: integer
          description: 歌词行索引
          example: 0
        timestamp:
          type: number
          format: float
          description: 歌词原始时间戳（秒）
          example: 0.5
        play_time:
          type: number
          format: float
          description: 应用 offset 后的歌词展示时间（秒）
          example: 0.3
        text:
          type: string
          description: 歌词文本
          example: "往事就像流星刹那划过心房"
        sub_text:
          type: string
          description: 翻译歌词文本；cloudmusicv3、qqmusic、kugou、sodamusic 提供，wesing 恒为空字符串。kugou 的翻译取自 KRC 内嵌的中文译轨、按行号对齐，回落行级 LRC、或该行无译文时为空；sodamusic 的翻译是平台单独下发的 tlyric LRC（`translations.cn`）、按绝对时间戳对齐，该曲无译轨或该行未被译轨覆盖（间奏等）时为空
          example: ""
        text_detailed:
          $ref: "#/components/schemas/LyricTextDetailed"

    LyricTextDetailed:
      oneOf:
        - type: object
          description: 逐字歌词，由 cloudmusicv3（YRC）、qqmusic（QRC）、kugou（KRC）、sodamusic（平台直接下发的明文 KRC）、wesing（进程内存卡拉OK字级时间）五家提供，复用同一结构、下游无需按平台分支解析。是否带逐字**逐行**判定：kugou 拿不到 KRC 回落行级 LRC、或 wesing 某行字级时间轴不合法时，该行退回行级、此字段为 `{}`。sodamusic 无行级回落——KRC 解不出即整曲按无歌词处理（`index` 归 -1），故它的每一行要么都带逐字，要么根本没有行。
          maxProperties: 0
          example: {}
        - type: object
          description: 主歌词逐字/细粒度扩展。
          required: [timestamp, play_time, duration, words]
          properties:
            timestamp:
              type: number
              format: float
              description: 逐字行原始起始时间（秒）
              example: 4.44
            play_time:
              type: number
              format: float
              description: 逐字行应用 offset 后的展示时间（秒）
              example: 3.94
            duration:
              type: number
              format: float
              description: 逐字行持续时间（秒）
              example: 3.46
            words:
              type: array
              items:
                $ref: "#/components/schemas/LyricTextDetailedWord"

    LyricTextDetailedWord:
      type: object
      required: [timestamp, play_time, duration, text]
      properties:
        timestamp:
          type: number
          format: float
          description: 字/词原始起始时间（秒）
          example: 4.44
        play_time:
          type: number
          format: float
          description: 字/词应用 offset 后的展示时间（秒）
          example: 3.94
        duration:
          type: number
          format: float
          description: 字/词持续时间（秒）
          example: 0.67
        text:
          type: string
          description: 字/词文本
          example: "还"

    LyricDetailedLine:
      type: object
      required: [lyric_index, timestamp, play_time, duration, text, words]
      properties:
        lyric_index:
          type: integer
          description: 对应 lyrics[] 中的行索引
          example: 0
        timestamp:
          type: number
          format: float
          description: 逐字行原始起始时间（秒）
          example: 4.44
        play_time:
          type: number
          format: float
          description: 逐字行应用 offset 后的展示时间（秒）
          example: 3.94
        duration:
          type: number
          format: float
          description: 逐字行持续时间（秒）
          example: 3.46
        text:
          type: string
          description: 由 words[].text 拼接得到的逐字源文本，不来自 lyrics[].text
          example: "还没"
        words:
          type: array
          items:
            $ref: "#/components/schemas/LyricTextDetailedWord"

    AllLyricsData:
      type: object
      required: [title, duration, position, progress, count, lyrics, lyrics_detailed]
      properties:
        title:
          type: string
          description: 歌曲标题。拼接顺序按播放器而异，详见 SongInfo.title
          example: "晚风 - 陈婧霏"
        duration:
          type: number
          format: float
          description: 歌曲总时长（秒）
          example: 296
        position:
          type: number
          format: float
          description: 整曲实时播放位置（秒），= progress × duration，用于前端插值计时的初始锚点。顶层无「行」概念，逐行 play_time 在 lyrics[i] 内
          example: 1.75
        progress:
          type: number
          format: float
          description: 当前播放进度（0-1），与 lyric_update.progress 同类型
          example: 0.0059121624
        count:
          type: integer
          description: 歌词行数。无歌词时为 0，此时 lyrics 为空数组而 title/duration 照常有值
          example: 38
        lyrics:
          type: array
          description: 按 index 排序的歌词数组
          items:
            $ref: "#/components/schemas/LyricLine"
        lyrics_detailed:
          type: array
          description: 完整逐字歌词集合，内容仅从逐字源数据派生。cloudmusicv3 / qqmusic / kugou / sodamusic 有逐字源时有内容；kugou 回落行级 LRC 时、以及 wesing（无逐字源）为空数组。sodamusic 无行级回落，它的本数组要么与 lyrics 等长，要么两者同时为空
          items:
            $ref: "#/components/schemas/LyricDetailedLine"

    PlaybackTimeInfo:
      type: object
      required: [position, progress]
      properties:
        position:
          type: number
          format: float
          description: 整曲实时播放位置（秒）。不是歌词行的 play_time——它不减 offset，等价于 progress × duration。前端收到后以此为锚点重新开始插值
          example: 31.282999
        progress:
          type: number
          format: float
          description: 整曲播放进度（0-1），= position / 歌曲总时长
          example: 0.105743244

    PlayerSwitchInfo:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: 切换前的播放器标识名
          example: wesing
        to:
          type: string
          description: 切换后的播放器标识名
          example: cloudmusicv3

    # ----------------------------------------------------------
    # SSE 事件 schema（用于 text/event-stream 响应描述）
    # ----------------------------------------------------------
    SSELyricUpdateEvent:
      type: object
      description: |
        SSE 歌词更新事件。每行以 `data: ` 前缀发送 JSON。
        格式：`data: {"type":"lyric_update","player":"...","data":{...}}`
      required: [type, player, data]
      properties:
        type:
          type: string
          const: lyric_update
        player:
          type: string
          example: wesing
        data:
          oneOf:
            - $ref: "#/components/schemas/LyricUpdateData"
            - $ref: "#/components/schemas/EmptyObject"

    SSESongInfoUpdateEvent:
      type: object
      description: |
        SSE 歌曲信息更新事件。每行以 `data: ` 前缀发送 JSON。
        格式：`data: {"type":"song_info_update","player":"...","data":{...}}`
      required: [type, player, data]
      properties:
        type:
          type: string
          const: song_info_update
        player:
          type: string
          example: wesing
        data:
          oneOf:
            - $ref: "#/components/schemas/SongInfo"
            - $ref: "#/components/schemas/EmptyObject"
