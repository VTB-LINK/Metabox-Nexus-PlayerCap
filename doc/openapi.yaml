openapi: 3.1.0
info:
  title: Metabox-Nexus-PlayerCap API
  version: 3.0.0-beta.1
  description: |
    VTB-TOOLS Metabox-Nexus-PlayerCap 多播放器歌词捕获服务 API。

    **多播放器架构：** 所有 HTTP 响应和 WS/SSE 事件均包含 `player` 字段，标识数据来源的播放器。当前五家：`"wesing"`（全民K歌）、`"cloudmusicv3"`（网易云音乐 v3）、`"qqmusic"`（QQ 音乐）、`"kugou"`（酷狗音乐）、`"sodamusic"`（汽水音乐）。**五家的能力不一致**，逐字与翻译的差异见各字段说明。

    **空数据约定：** 所有事件在无数据时统一返回 `"data": {}`（空对象），而非 `null`。

    **Per-player 端点：** 除 `/health-check` 和 `/service-status` 外，所有端点均有播放器专属路径版本（如 `/wesing/ws`、`/cloudmusicv3/all_lyrics`、`/sodamusic/ws`）。根端点跟随活跃播放器，Per-player 端点始终返回指定播放器数据。

    **Root WS 空闲态：** 当客户端连入根端点 `/ws` 且当前没有活跃播放器时，服务端会立即发送一个 `player_clear` 初始事件，而不是静默不输出。

servers:
  - url: http://localhost:8765
    description: 本地开发服务器

tags:
  - name: 系统
    description: 健康检查和服务状态
  - name: 歌词
    description: 歌词相关接口（完整歌词列表、当前歌词）
  - name: 状态
    description: 播放状态查询
  - name: 歌曲信息
    description: 歌曲元数据（名称、歌手、封面等）
  - name: SSE推送
    description: Server-Sent Events 实时推送接口
  - name: WebSocket
    description: WebSocket 实时双向通信接口

paths:
  # ============================================================
  # 全局端点（无 player 参数）
  # ============================================================
  /health-check:
    get:
      tags: [系统]
      summary: 健康检查
      operationId: healthCheck
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthCheckData"
              examples:
                success:
                  summary: 成功
                  value:
                    code: 0
                    msg: success
                    player: internal
                    data:
                      now_time: "2026-03-19T12:34:56+08:00"

  /service-status:
    get:
      tags: [系统]
      summary: 服务状态信息
      operationId: serviceStatus
      description: |
        返回完整的服务状态信息，包括版本、配置、播放器状态、已连接客户端等。

        **version 说明：**
        - 编译时通过 `-ldflags "-X main.Version=3.0.0-beta.1"` 注入
        - 默认值为 `0.0.0`
        - `tag_name` 使用完整 semver；若 release 标题以 `-force` 结尾，则客户端允许强制同步到更低版本

        **config_sources 说明：**
        - 实际生效的配置来源列表。存在 `config.yml` 时其值为 `config.yml`（`内置默认` 已被它取代、不再出现在列表中）；命令行覆盖了任何键时追加 `命令行参数`。为未设键兜底的内置默认不体现在此列表
        - 可能的值：`"内置默认"`、`"config.yml"`、`"命令行参数"`

        **config_overwritten 说明：**
        - 列出被更高优先级来源覆盖的配置键名
        - 仅在有覆盖时出现非空数组

        **player_support 说明：**
        - 系统编译时注册的所有播放器标识名列表

        **player_running 说明：**
        - 当前正在运行（非 `offline` / `standby` / `waiting_process`）的播放器列表

        **player_status 说明：**
        - 所有支持的播放器及其当前状态（按注册顺序），值为 status 字符串
        - 可能的状态值：`"offline"`（服务端兜底：从未上报过状态）/ `"waiting_process"` / `"waiting_song"` / `"playing"` / `"paused"` / `"standby"` / `"error"`（仅 kugou 故障终态）。`"loading"` 为保留值，当前版本不会出现
        - 注意 `"error"` 不在 `player_running` 的排除集内，故障中的 kugou 仍会出现在 `player_running` 里

        **ws_connected 说明：**
        - `connected` - 布尔值，表示是否有客户端连接
        - `clients` - 字符串数组，已连接的客户端 IP 地址列表（RemoteAddr 格式）

        **endpoints 说明：**
        - 返回所有可用接口的完整地址（含 Per-player 端点）
        - WebSocket 使用 `ws://`，HTTP/SSE 使用 `http://`
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServiceStatusData"
              examples:
                success:
                  summary: 成功
                  value:
                    code: 0
                    msg: success
                    player: internal
                    data:
                      version: "3.0.0-beta.1"
                      addr: "0.0.0.0:8765"
                      now_time: "2026-03-19T12:34:56+08:00"
                      config_sources: ["config.yml", "命令行参数"]
                      config:
                        addr: "0.0.0.0:8765"
                        offset: 200
                        poll: 30
                        prior-player: ["wesing"]
                        prior-player-expire: 15
                        cloudmusicv3-effect-strategy: fadeout
                        wesing-offset: 200
                        wesing-poll: 30
                        cloudmusicv3-offset: 500
                        cloudmusicv3-poll: 30
                        qqmusic-offset: 200
                        qqmusic-poll: 50
                        kugou-offset: 430
                        kugou-poll: 30
                        sodamusic-offset: 200
                        sodamusic-poll: 30
                      config_overwritten: ["offset", "wesing-poll"]
                      player_support: ["wesing", "cloudmusicv3", "qqmusic", "kugou", "sodamusic"]
                      player_running: ["wesing"]
                      player_status:
                        wesing: playing
                        cloudmusicv3: waiting_process
                        qqmusic: waiting_process
                        kugou: waiting_process
                        sodamusic: waiting_process
                      endpoints:
                        health-check: "http://0.0.0.0:8765/health-check"
                        service-status: "http://0.0.0.0:8765/service-status"
                        ws: "ws://0.0.0.0:8765/ws"
                        all_lyrics: "http://0.0.0.0:8765/all_lyrics"
                        lyric_update: "http://0.0.0.0:8765/lyric_update"
                        status_update: "http://0.0.0.0:8765/status_update"
                        song_info: "http://0.0.0.0:8765/song_info"
                        lyric_update-SSE: "http://0.0.0.0:8765/lyric_update-SSE"
                        song_info-SSE: "http://0.0.0.0:8765/song_info-SSE"
                        wesing:
                          ws: "ws://0.0.0.0:8765/wesing/ws"
                          all_lyrics: "http://0.0.0.0:8765/wesing/all_lyrics"
                          lyric_update: "http://0.0.0.0:8765/wesing/lyric_update"
                          status_update: "http://0.0.0.0:8765/wesing/status_update"
                          song_info: "http://0.0.0.0:8765/wesing/song_info"
                          lyric_update-SSE: "http://0.0.0.0:8765/wesing/lyric_update-SSE"
                          song_info-SSE: "http://0.0.0.0:8765/wesing/song_info-SSE"
                        cloudmusicv3:
                          ws: "ws://0.0.0.0:8765/cloudmusicv3/ws"
                          all_lyrics: "http://0.0.0.0:8765/cloudmusicv3/all_lyrics"
                          lyric_update: "http://0.0.0.0:8765/cloudmusicv3/lyric_update"
                          status_update: "http://0.0.0.0:8765/cloudmusicv3/status_update"
                          song_info: "http://0.0.0.0:8765/cloudmusicv3/song_info"
                          lyric_update-SSE: "http://0.0.0.0:8765/cloudmusicv3/lyric_update-SSE"
                          song_info-SSE: "http://0.0.0.0:8765/cloudmusicv3/song_info-SSE"
                          effect-ws: "ws://0.0.0.0:8765/cloudmusicv3/effect-ws"
                          effect-ingest: "ws://0.0.0.0:8765/cloudmusicv3/effect-ingest"
                        qqmusic:
                          ws: "ws://0.0.0.0:8765/qqmusic/ws"
                          all_lyrics: "http://0.0.0.0:8765/qqmusic/all_lyrics"
                          lyric_update: "http://0.0.0.0:8765/qqmusic/lyric_update"
                          status_update: "http://0.0.0.0:8765/qqmusic/status_update"
                          song_info: "http://0.0.0.0:8765/qqmusic/song_info"
                          lyric_update-SSE: "http://0.0.0.0:8765/qqmusic/lyric_update-SSE"
                          song_info-SSE: "http://0.0.0.0:8765/qqmusic/song_info-SSE"
                        kugou:
                          ws: "ws://0.0.0.0:8765/kugou/ws"
                          all_lyrics: "http://0.0.0.0:8765/kugou/all_lyrics"
                          lyric_update: "http://0.0.0.0:8765/kugou/lyric_update"
                          status_update: "http://0.0.0.0:8765/kugou/status_update"
                          song_info: "http://0.0.0.0:8765/kugou/song_info"
                          lyric_update-SSE: "http://0.0.0.0:8765/kugou/lyric_update-SSE"
                          song_info-SSE: "http://0.0.0.0:8765/kugou/song_info-SSE"
                        sodamusic:
                          ws: "ws://0.0.0.0:8765/sodamusic/ws"
                          all_lyrics: "http://0.0.0.0:8765/sodamusic/all_lyrics"
                          lyric_update: "http://0.0.0.0:8765/sodamusic/lyric_update"
                          status_update: "http://0.0.0.0:8765/sodamusic/status_update"
                          song_info: "http://0.0.0.0:8765/sodamusic/song_info"
                          lyric_update-SSE: "http://0.0.0.0:8765/sodamusic/lyric_update-SSE"
                          song_info-SSE: "http://0.0.0.0:8765/sodamusic/song_info-SSE"
                      client_count: 2
                      ws_connected:
                        connected: true
                        clients:
                          - "192.168.1.100:54321"
                          - "192.168.1.200:54322"

  # ============================================================
  # 根端点（跟随活跃播放器）
  # ============================================================
  /all_lyrics:
    get:
      tags: [歌词]
      summary: 完整歌词列表
      operationId: getAllLyrics
      description: |
        返回当前活跃播放器正在播放歌曲的完整歌词列表。

        - `player` - 数据来源播放器（根端点时为当前活跃播放器）
        - `duration` - 歌曲总时长（秒）
        - `position` - 整曲实时播放位置（秒），= `progress × duration`，用于前端插值计时的初始锚点。逐行的播出时间见 `lyrics[].play_time`
        - `progress` - 当前播放进度（0-1），与 `lyric_update.progress` 同类型
        - `count` - 歌词行数
        - `lyrics` - 按 index 排序的歌词数组
        - `lyrics[].timestamp` - 该歌词行的原始起始时间（秒）
        - `lyrics[].play_time` - 该歌词行应用 offset 后的展示时间（秒）
        - `lyrics[].sub_text` - 翻译歌词文本；cloudmusicv3、qqmusic、kugou、sodamusic 提供，wesing 恒为空字符串。kugou 的翻译取自 KRC 内嵌的中文译轨、按行号对齐，回落行级 LRC、或该行无译文时为空；sodamusic 的翻译是平台单独下发的 tlyric LRC（`translations.cn`）、按绝对时间戳对齐，该曲无译轨或该行未被译轨覆盖（间奏等）时为空
        - `lyrics[].text_detailed` - 逐字/细粒度歌词扩展（含 timestamp、play_time、duration、words[]）；无逐字数据时为空对象 `{}`
        - `lyrics_detailed` - 完整逐字歌词集合（仅包含有逐字数据的行）。cloudmusicv3（YRC）/ qqmusic（QRC）/ kugou（KRC）/ sodamusic（明文 KRC）提供逐字时有内容；kugou 回落到行级 LRC 时、以及 wesing（无逐字源），恒为 `[]`。sodamusic 无行级回落，故它的 `lyrics_detailed` 要么与 `lyrics` 等长，要么两者同时为空
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/AllLyricsData"
                          - $ref: "#/components/schemas/EmptyObject"
              examples:
                有歌词时:
                  summary: 有歌词时（cloudmusicv3，YRC 逐字 + 翻译）。示例已裁剪，只删元素不改值：lyrics 实际 88 行（此处留 2）、lyrics_detailed 实际 88 项（留 1）、每行 words 实际 6-8 个（留 2）。故 count 与数组长度对不上，真实响应中两者一致。
                  value:
                    code: 0
                    msg: success
                    player: cloudmusicv3
                    data:
                      title: "Cold - Maroon 5 / Future"
                      duration: 234.308
                      position: 0
                      progress: 0
                      count: 88
                      lyrics:
                        - index: 0
                          timestamp: 3.6100001
                          play_time: 3.1100001
                          text: "Cold enough to chill my bones"
                          sub_text: "冷得足以冻到我的骨头"
                          text_detailed:
                            timestamp: 4.44
                            play_time: 3.94
                            duration: 3.48
                            words:
                              - { timestamp: 4.44, play_time: 3.94, duration: 1.08, text: "Cold " }
                              - { timestamp: 5.52, play_time: 5.02, duration: 0.36, text: "enough " }
                        - index: 1
                          timestamp: 7.57
                          play_time: 7.07
                          text: "It feels like I don't know you anymore"
                          sub_text: "感觉就像我已经不再认识你了"
                          text_detailed:
                            timestamp: 7.92
                            play_time: 7.42
                            duration: 3.48
                            words:
                              - { timestamp: 7.92, play_time: 7.42, duration: 0.06, text: "It " }
                              - { timestamp: 7.98, play_time: 7.48, duration: 0.3, text: "feels " }
                      lyrics_detailed:
                        - lyric_index: 0
                          timestamp: 4.44
                          play_time: 3.94
                          duration: 3.48
                          text: "Cold enough to chill my bones"
                          words:
                            - { timestamp: 4.44, play_time: 3.94, duration: 1.08, text: "Cold " }
                            - { timestamp: 5.52, play_time: 5.02, duration: 0.36, text: "enough " }
                有歌词时（sodamusic，明文 KRC 逐字）:
                  summary: 中途接入 sodamusic（真实录音）。示例已裁剪，只删元素不改值：lyrics 实际 35 行（此处留 1）、lyrics_detailed 实际 35 项（留 1）、每行 words 实际 6 个（留 3），故 count 与数组长度对不上，真实响应中两者一致。注意 sodamusic 的 title 是「歌手 - 歌名」（同 kugou，与 wesing / cloudmusicv3 / qqmusic 相反）；lyrics_detailed 与 lyrics 等长（它无行级回落）。
                  value:
                    code: 0
                    msg: success
                    player: sodamusic
                    data:
                      title: "今晚吃什么呢 - 代替我（Tonight）"
                      duration: 193.65599
                      position: 102.935074
                      progress: 0.5315357
                      count: 35
                      lyrics:
                        - index: 0
                          timestamp: 0.09
                          play_time: 0
                          text: "谁能够代替我"
                          sub_text: ""
                          text_detailed:
                            timestamp: 0.09
                            play_time: 0
                            duration: 1.29
                            words:
                              - { timestamp: 0.09, play_time: 0, duration: 0.23, text: "谁" }
                              - { timestamp: 0.32, play_time: 0.11999999, duration: 0.18, text: "能" }
                              - { timestamp: 0.5, play_time: 0.3, duration: 0.18, text: "够" }
                      lyrics_detailed:
                        - lyric_index: 0
                          timestamp: 0.09
                          play_time: 0
                          duration: 1.29
                          text: "谁能够代替我"
                          words:
                            - { timestamp: 0.09, play_time: 0, duration: 0.23, text: "谁" }
                            - { timestamp: 0.32, play_time: 0.11999999, duration: 0.18, text: "能" }
                            - { timestamp: 0.5, play_time: 0.3, duration: 0.18, text: "够" }
                无歌词时:
                  summary: 平台未返回歌词（cloudmusicv3 纯音乐）。data 不是空对象——lyrics 为空数组、count 为 0，而 title/duration 照常有值。
                  value:
                    code: 0
                    msg: success
                    player: cloudmusicv3
                    data:
                      title: "Sunset - Klonopin"
                      duration: 180
                      position: 0
                      progress: 0
                      count: 0
                      lyrics: []
                      lyrics_detailed: []

  /lyric_update:
    get:
      tags: [歌词]
      summary: 当前歌词（最新一条）
      operationId: getLyricUpdate
      description: |
        返回当前活跃播放器正在播放的最新一行歌词。

        - `index` - 歌词行号；`-1` 表示平台未返回可用歌词数据（见下方说明）
        - `text` - 主歌词文本
        - `sub_text` - 翻译歌词文本；cloudmusicv3、qqmusic、kugou、sodamusic 提供，wesing 恒为空字符串。kugou 的翻译取自 KRC 内嵌的中文译轨、按行号对齐，回落行级 LRC、或该行无译文时为空；sodamusic 的翻译是平台单独下发的 tlyric LRC（`translations.cn`）、按绝对时间戳对齐，该曲无译轨或该行未被译轨覆盖（间奏等）时为空
        - `timestamp` - 歌词时间戳（秒）
        - `play_time` - 本行歌词的上屏时间（秒）。基准为 `timestamp` - offset；若本行逐字首字早于行时间戳（典型是 cloudmusicv3 的 YRC 长引子行；kugou 与 sodamusic 的 KRC 字级偏移相对行首、首字即行首，不会提前），取首字时刻，此时 play_time 小于该基准。`index` 为 -1（无可显示歌词）时为 0
        - `position` - 整曲实时播放位置（秒），= `progress × duration`，每条都带、与 index 无关；与 `play_time`（本行播出时间）是两个量
        - `progress` - 整曲播放进度（0-1），= `position / 歌曲总时长`；与 `play_time`（本行歌词的播出时间）无换算关系
        - `text_detailed` - 逐字/细粒度歌词扩展（含 timestamp、play_time、duration、words[]）；无逐字数据时为空对象 `{}`

        **`index: -1` 纯音乐说明：**
        当平台未返回任何歌词数据时，发送 `index: -1` 而非空对象 `{}`。此时 `timestamp` 为 `0`，`sub_text` 为空字符串，`text_detailed` 为 `{}`；**`progress` 照常反映整曲播放进度，不为 `0`**（歌没有歌词，但它还在播）。
        **`text` 不保证为空**：cloudmusicv3 与 kugou 对纯音乐返回一行「纯音乐，请欣赏」，服务端已把 `index` 归一为 `-1`，但该提示语原样保留在 `text` 里；qqmusic 的 API 返回零行、以及 sodamusic 的平台未给出 KRC（`lyrics.type` 非 `krc` 或内容为空）时，`text` 为 `""`。提示语归一逻辑对五家统一生效，只是尚未观测到汽水发出这一行。
        判断有无歌词一律用 `index !== -1`，不要看 `text`。
        与此同时会发送一条 `all_lyrics`（`count: 0`，`lyrics: []`）。
        客户端利用 `msg.data.index === -1` 识别纯音乐，而非依赖 `msg.data.text`。
      responses:
        "200":
          description: 200 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTTPResponse"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/LyricUpdateData"
                          - $ref: "#/components/schemas/EmptyObject"
              examples:
                播放中:
                  summary: 播放中（wesing，此行无逐字）。wesing 的逐字来自进程内存的卡拉OK字级时间、逐行判定，时间轴不合法的行退回行级、text_detailed 为 {}（如本例）；wesing 无翻译，sub_text 恒空。
                  value:
                    code: 0
                    msg: success
                    player: wesing
                    data:
                      index: 1
                      text: "往事就像流星刹那划过心房"
                      sub_text: ""
                      timestamp: 31.483
                      play_time: 31.282999
                      position: 31.282999
                      progress: 0.105743244
                      text_detailed: {}
                播放中（逐字 + 翻译）:
                  summary: 播放中（cloudmusicv3，YRC 逐字 + 翻译，真实录音）。words 已裁剪至 2 个，实际 9 个——只删元素不改值。本行逐字首字（156.96）早于行时间戳（157.22），故 play_time 取首字时刻减 offset；position（整曲实时位置 156.4659）与 play_time（156.46）此处相差 0.006s。
                  value:
                    code: 0
                    msg: success
                    player: cloudmusicv3
                    data:
                      index: 37
                      text: "There's plenty of time to sleep when we die"
